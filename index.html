<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الجمعية الصغيرة</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
  body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);min-height:100vh}
  .card{background:rgba(255,255,255,.96);border:1px solid #e2e8f0;border-radius:1.25rem;box-shadow:0 4px 18px rgba(15,23,42,.06)}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .fade{animation:fade .25s ease-out}
  .inp{width:100%;padding:.7rem 1rem;border:1px solid #e2e8f0;border-radius:.75rem;font-size:.85rem;background:#fff}
  .inp:focus{outline:2px solid #10b981;outline-offset:0}
  .btn{padding:.6rem 1rem;border-radius:.75rem;font-weight:700;font-size:.8rem;transition:.15s;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .b-pri{background:linear-gradient(90deg,#059669,#0d9488);color:#fff}.b-pri:hover{filter:brightness(.93)}
  .b-sec{background:#f1f5f9;color:#334155}.b-sec:hover{background:#e2e8f0}
  .b-red{background:#fff1f2;color:#e11d48}.b-red:hover{background:#ffe4e6}
</style>
</head>
<body class="text-slate-800 antialiased">

<header class="bg-white shadow-sm sticky top-0 z-40 border-b border-slate-100">
  <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3 cursor-pointer" data-act="go-home">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-md"><i class="fa-solid fa-people-roof"></i></div>
      <div><h1 class="font-bold text-slate-900 leading-tight">الجمعية الصغيرة</h1><p class="text-xs text-slate-500" id="hdrSub">منصة التعاون العائلي</p></div>
    </div>
    <div class="flex items-center gap-2" id="nav"></div>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-6" id="app"></main>
<div id="modal"></div>
<div id="toasts" class="fixed bottom-5 left-5 z-[60] space-y-2"></div>

<script>
/* ============ الإعدادات ============ */
const firebaseConfig = {
  apiKey: "AIzaSyBD_a9TrhsCL5ognnIxhv2OuyiWJmdr33o",
  authDomain: "aljamiyahapp.firebaseapp.com",
  projectId: "aljamiyahapp",
  storageBucket: "aljamiyahapp.firebasestorage.app",
  messagingSenderId: "508199870007",
  appId: "1:508199870007:web:5aeee0d4bdbb4a4893e9b2"
};
const EMAILJS_PUBLIC_KEY = "o2fIFJJYtmnzK2XKg";
const EMAILJS_SERVICE_ID = "service_5dxkih9";
const EMAILJS_TEMPLATE_ID = "template_mr4lkca";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
const OWNER_EMAIL = "mamydady87@gmail.com"; // بريد المالك: لا توجد كلمة مرور هنا، الهوية تُتحقق من Firebase
const FV = firebase.firestore.FieldValue;
emailjs.init(EMAILJS_PUBLIC_KEY);

const BANKS = ["مصرف الراجحي","البنك الأهلي السعودي","بنك الإنماء","بنك الرياض","بنك البلاد","بنك الجزيرة","السعودي الفرنسي","البنك العربي الوطني","البنك السعودي الأول","بنك رقمي / أخرى","كاش (نقداً)"];

/* ============ الحالة ============ */
const state = {
  user: null, profile: null, isAdmin: false, view: 'loading', authMode: 'login',
  jamiyat: [], invites: [], activeId: null, j: null, members: {}, payments: [], jInvites: [],
  admin: { jamiyat: [], users: [] }, unsubs: [], jUnsubs: []
};

/* ============ أدوات ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lc = s => String(s || '').trim().toLowerCase();
const money = n => Number(n || 0).toLocaleString('ar-SA') + ' ريال';
const bankOpts = sel => BANKS.map(b => `<option ${b === sel ? 'selected' : ''}>${b}</option>`).join('');
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const fixIban = s => String(s || '').replace(/\s+/g, '').toUpperCase();
const validIban = s => /^SA\d{22}$/.test(fixIban(s));
const validPhone = s => /^05\d{8}$/.test(String(s || '').trim());
const fmtDate = d => d.toLocaleDateString('ar-SA-u-ca-gregory', { year: 'numeric', month: 'long', day: 'numeric' });
const fmtMonth = d => d.toLocaleDateString('ar-SA-u-ca-gregory', { year: 'numeric', month: 'long' });

function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = `${type === 'error' ? 'bg-rose-600' : type === 'info' ? 'bg-slate-800' : 'bg-emerald-600'} text-white px-4 py-3 rounded-2xl shadow-xl text-xs font-bold fade max-w-xs`;
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}
function authErr(e) {
  const m = {
    'auth/email-already-in-use': 'هذا البريد مسجل مسبقاً، جرّب تسجيل الدخول.',
    'auth/invalid-email': 'صيغة البريد غير صحيحة.',
    'auth/weak-password': 'كلمة المرور ضعيفة (6 أحرف على الأقل).',
    'auth/invalid-credential': 'البريد أو كلمة المرور غير صحيحة.',
    'auth/wrong-password': 'كلمة المرور غير صحيحة.',
    'auth/user-not-found': 'لا يوجد حساب بهذا البريد.',
    'auth/too-many-requests': 'محاولات كثيرة، حاول لاحقاً.',
    'auth/popup-closed-by-user': 'تم إغلاق نافذة جوجل.',
    'auth/unauthorized-domain': 'هذا الدومين غير مضاف في Authorized domains بإعدادات Firebase.',
    'auth/network-request-failed': 'مشكلة في الاتصال بالإنترنت.'
  };
  return m[e.code] || e.message;
}
async function sendMail(to, name, subject, message) {
  return emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { to_email: to, to_name: name, subject, message });
}
function mailErrHint(e) {
  const raw = String((e && (e.text || e.message)) || e || 'خطأ غير معروف');
  const st = e && e.status;
  let hint = '';
  if (/recipient/i.test(raw)) hint = 'حقل "To Email" في قالب EmailJS فارغ. افتح القالب واجعله {{to_email}}.';
  else if (st === 412 || /invalid grant|authenticat|insufficient/i.test(raw)) hint = 'ربط خدمة البريد انتهى. في EmailJS ← Email Services ← أعد ربط الخدمة (Reconnect).';
  else if (st === 403 || /origin|domain|not allowed/i.test(raw)) hint = 'الدومين غير مسموح. في EmailJS ← Account ← Security أضف دومين موقعك أو عطّل التقييد.';
  else if (st === 400 || /template|service/i.test(raw)) hint = 'تحقق من Service ID وTemplate ID وPublic Key في أعلى الكود.';
  else if (st === 429 || /limit|quota/i.test(raw)) hint = 'تجاوزت حد الرسائل في باقتك (200 شهرياً في المجانية).';
  else if (st === 0 || /network|fetch/i.test(raw)) hint = 'مشكلة اتصال أو حظر من مانع إعلانات/إضافة في المتصفح.';
  return { raw: (st ? st + ' — ' : '') + raw, hint };
}
const appUrl = () => location.origin + location.pathname;

/* ============ منطق الجمعية ============ */
function monthIdx(j) {
  const s = new Date(j.startDate + 'T00:00:00'), n = new Date();
  return (n.getFullYear() - s.getFullYear()) * 12 + n.getMonth() - s.getMonth();
}
function dayIn(j, idx, day) {
  const s = new Date(j.startDate + 'T00:00:00');
  const first = new Date(s.getFullYear(), s.getMonth() + idx, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return new Date(first.getFullYear(), first.getMonth(), Math.min(day, last));
}
function ctx() {
  const j = state.j; if (!j) return null;
  const idx = monthIdx(j);
  const cur = Math.min(Math.max(idx, 0), j.count - 1);
  const turns = j.turns || [];
  const recUid = turns[cur] || null;
  const rec = recUid ? state.members[recUid] : null;
  const pays = state.payments.filter(p => p.month === cur);
  return { j, idx, cur, finished: idx >= j.count, started: idx >= 0, turns, recUid, rec, pays,
           isCreator: j.creatorUid === state.user.uid, isRec: recUid === state.user.uid,
           myPay: pays.find(p => p.uid === state.user.uid) };
}
function payStatus(c, uid) {
  if (uid === c.recUid) return 'recipient';
  const p = c.pays.find(x => x.uid === uid);
  return p ? p.status : 'unpaid';
}

/* ============ المصادقة ============ */
auth.onAuthStateChanged(async user => {
  cleanup(state.unsubs); cleanup(state.jUnsubs);
  state.user = user; state.profile = null; state.isAdmin = false;
  state.jamiyat = []; state.invites = [];
  if (!user) { state.view = 'auth'; return render(); }

  const needsVerify = !user.emailVerified && user.providerData.every(p => p.providerId === 'password');
  if (needsVerify) { state.view = 'verify'; return render(); }

  try {
    const snap = await db.collection('users').doc(user.uid).get();
    state.profile = snap.exists ? snap.data() : null;
    const adm = await db.collection('admins').doc(user.uid).get().catch(() => ({ exists: false }));
    state.isAdmin = adm.exists || (lc(user.email) === OWNER_EMAIL && user.emailVerified);
  } catch (e) { toast('تعذر تحميل الحساب: ' + e.message, 'error'); }

  if (!state.profile) { state.view = 'complete'; return render(); }
  startListeners();
  if (state.isAdmin) { state.view = 'admin'; render(); loadAdmin(); toast('مرحباً بك في لوحة المالك', 'info'); return; }
  state.view = 'home'; render();
});

function cleanup(arr) { arr.forEach(u => u()); arr.length = 0; }

function startListeners() {
  const uid = state.user.uid, email = lc(state.user.email);
  state.unsubs.push(
    db.collection('jamiyat').where('memberUids', 'array-contains', uid).onSnapshot(s => {
      state.jamiyat = s.docs.map(d => ({ id: d.id, ...d.data() }));
      if (['home'].includes(state.view)) render();
    }, e => toast('خطأ في تحميل الجمعيات: ' + e.message, 'error')),
    db.collection('invites').where('email', '==', email).where('status', '==', 'pending').onSnapshot(s => {
      state.invites = s.docs.map(d => ({ id: d.id, ...d.data() }));
      if (state.view === 'home') render();
    }, e => toast('خطأ في تحميل الدعوات: ' + e.message, 'error'))
  );
}

async function doRegister(f) {
  const name = f.name.value.trim(), email = lc(f.email.value), pass = f.password.value;
  const phone = f.phone.value.trim(), bank = f.bank.value, iban = fixIban(f.iban.value);
  if (name.length < 3) return toast('اكتب الاسم الثلاثي', 'error');
  if (!validEmail(email)) return toast('البريد غير صحيح', 'error');
  if (pass.length < 6) return toast('كلمة المرور 6 أحرف على الأقل', 'error');
  if (!validPhone(phone)) return toast('رقم الجوال يجب أن يبدأ بـ 05 ويتكون من 10 أرقام', 'error');
  if (!bank.startsWith('كاش') && !validIban(iban)) return toast('الآيبان يجب أن يكون SA متبوعاً بـ 22 رقماً', 'error');
  if (!f.terms.checked) return toast('يجب الموافقة على الشروط', 'error');
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await cred.user.updateProfile({ displayName: name });
    await db.collection('users').doc(cred.user.uid).set({ name, email, phone, bank, iban: bank.startsWith('كاش') ? '' : iban, avatar: '', createdAt: FV.serverTimestamp() });
    await cred.user.sendEmailVerification({ url: appUrl() });
    toast('تم إنشاء الحساب وإرسال رابط التحقق إلى بريدك');
    await auth.signOut().catch(() => {});
    state.authMode = 'login'; state.view = 'auth'; render();
    toast('فعّل بريدك من الرسالة ثم سجّل الدخول', 'info');
  } catch (e) { toast(authErr(e), 'error'); }
}
async function doLogin(f) {
  try {
    const cred = await auth.signInWithEmailAndPassword(lc(f.email.value), f.password.value);
    if (!cred.user.emailVerified) {
      await cred.user.sendEmailVerification({ url: appUrl() }).catch(() => {});
    }
  } catch (e) { toast(authErr(e), 'error'); }
}
async function doReset(f) {
  try { await auth.sendPasswordResetEmail(lc(f.email.value), { url: appUrl() }); toast('أُرسل رابط إعادة تعيين كلمة المرور إلى بريدك'); state.authMode = 'login'; render(); }
  catch (e) { toast(authErr(e), 'error'); }
}
async function doGoogle() {
  try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch (e) { toast(authErr(e), 'error'); }
}
async function doCompleteProfile(f) {
  const phone = f.phone.value.trim(), bank = f.bank.value, iban = fixIban(f.iban.value);
  if (!validPhone(phone)) return toast('رقم الجوال غير صحيح', 'error');
  if (!bank.startsWith('كاش') && !validIban(iban)) return toast('الآيبان غير صحيح', 'error');
  const u = state.user;
  const profile = { name: u.displayName || 'عضو', email: lc(u.email), phone, bank, iban: bank.startsWith('كاش') ? '' : iban, avatar: u.photoURL || '', createdAt: FV.serverTimestamp() };
  try {
    await db.collection('users').doc(u.uid).set(profile);
    state.profile = profile; startListeners();
    if (state.isAdmin) { state.view = 'admin'; render(); loadAdmin(); } else { state.view = 'home'; render(); }
  } catch (e) { toast(e.message, 'error'); }
}
async function recheckVerification() {
  await auth.currentUser.reload();
  if (auth.currentUser.emailVerified) { toast('تم التحقق من البريد'); location.reload(); }
  else toast('لم يتم التحقق بعد، افتح الرابط المرسل لبريدك', 'error');
}

/* ============ الدعوات ============ */
async function handleInvite(f) {
  const c = ctx(); const name = f.name.value.trim(), email = lc(f.email.value);
  if (!validEmail(email)) return toast('البريد غير صحيح', 'error');
  if (Object.values(state.members).some(m => lc(m.email) === email)) return toast('هذا الشخص عضو بالفعل', 'error');
  const pending = state.jInvites.filter(i => i.status === 'pending').length;
  if (c.j.memberUids.length + pending >= c.j.count) return toast('اكتمل عدد الأعضاء المحدد للجمعية', 'error');
  const id = `${c.j.id}__${email}`;
  try {
    await db.collection('invites').doc(id).set({
      jamiyaId: c.j.id, jamiyaName: c.j.name, amount: c.j.amount, email, name,
      invitedBy: state.user.uid, inviterName: state.profile.name, creatorUid: c.j.creatorUid,
      status: 'pending', createdAt: FV.serverTimestamp()
    });
    closeModal(); toast('تم إنشاء الدعوة، وستظهر للمدعو فور دخوله بنفس البريد');
    sendInviteMail({ email, name, jamiyaName: c.j.name, inviterName: state.profile.name, amount: c.j.amount });
  } catch (e) { toast('تعذر إنشاء الدعوة: ' + e.message, 'error'); }
}
function inviteText(i) {
  return `السلام عليكم ${i.name}،\nدعاك ${i.inviterName} للانضمام إلى جمعية "${i.jamiyaName}" بقيمة اشتراك ${i.amount} ريال شهرياً.\n\nلقبول الدعوة افتح الرابط وسجّل الدخول بنفس هذا البريد (${i.email}):\n${appUrl()}`;
}
async function sendInviteMail(i) {
  state.lastInvite = i;
  try {
    await sendMail(i.email, i.name, `دعوة للانضمام إلى جمعية ${i.jamiyaName}`, inviteText(i));
    toast('✉️ أُرسل بريد الدعوة إلى ' + i.email);
  } catch (e) {
    const { raw, hint } = mailErrHint(e);
    console.error('EmailJS error', e);
    showModal('تعذر إرسال بريد الدعوة', `<div class="space-y-3 text-xs">
      <p class="text-slate-600">الدعوة محفوظة وستظهر لـ <b dir="ltr">${esc(i.email)}</b> داخل التطبيق عند دخوله بنفس البريد. لكن البريد لم يُرسل.</p>
      <div class="p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-800" dir="ltr">${esc(raw)}</div>
      ${hint ? `<div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-900">${esc(hint)}</div>` : ''}
      <p class="font-bold">أرسل الدعوة بطريقة أخرى:</p>
      <div class="flex gap-2 flex-wrap"><a class="btn b-pri" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(inviteText(i))}"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
      <button class="btn b-sec" data-act="copy-invite"><i class="fa-solid fa-copy"></i> نسخ نص الدعوة</button></div></div>`);
  }
}
async function acceptInvite(inviteId) {
  const inv = state.invites.find(i => i.id === inviteId); if (!inv) return;
  const uid = state.user.uid, p = state.profile;
  const batch = db.batch();
  const jRef = db.collection('jamiyat').doc(inv.jamiyaId);
  batch.update(jRef, { memberUids: FV.arrayUnion(uid), turns: FV.arrayUnion(uid) });
  batch.update(db.collection('invites').doc(inviteId), { status: 'accepted' });
  batch.set(jRef.collection('members').doc(uid), { uid, name: p.name, email: lc(state.user.email), phone: p.phone, bank: p.bank, iban: p.iban });
  try { await batch.commit(); toast('تم الانضمام للجمعية'); } catch (e) { toast('تعذر الانضمام: ' + e.message, 'error'); }
}
async function declineInvite(inviteId) {
  try { await db.collection('invites').doc(inviteId).update({ status: 'declined' }); toast('تم رفض الدعوة', 'info'); }
  catch (e) { toast(e.message, 'error'); }
}

/* ============ إنشاء وفتح الجمعية ============ */
async function handleCreate(f) {
  const name = f.jname.value.trim(), count = parseInt(f.count.value), amount = parseFloat(f.amount.value);
  const startDate = f.start.value, lastDay = parseInt(f.lastDay.value), payDay = parseInt(f.payDay.value);
  if (!name || !startDate) return toast('أكمل الحقول المطلوبة', 'error');
  if (!(count >= 2 && count <= 30)) return toast('عدد الأعضاء بين 2 و30', 'error');
  if (!(amount >= 1)) return toast('قيمة الاشتراك غير صحيحة', 'error');
  if (!(lastDay >= 1 && lastDay <= 31 && payDay >= 1 && payDay <= 31)) return toast('الأيام بين 1 و31', 'error');
  const uid = state.user.uid, p = state.profile;
  const ref = db.collection('jamiyat').doc();
  const batch = db.batch();
  batch.set(ref, { name, count, amount, startDate, lastDay, payDay, creatorUid: uid, creatorName: p.name, memberUids: [uid], turns: [uid], modRequest: null, createdAt: FV.serverTimestamp() });
  batch.set(ref.collection('members').doc(uid), { uid, name: p.name, email: lc(state.user.email), phone: p.phone, bank: p.bank, iban: p.iban });
  try { await batch.commit(); toast('تم إنشاء الجمعية'); openJamiya(ref.id); }
  catch (e) { toast('تعذر الإنشاء: ' + e.message, 'error'); }
}
function openJamiya(id) {
  cleanup(state.jUnsubs); state.jInviteSub = false;
  state.activeId = id; state.j = null; state.members = {}; state.payments = []; state.jInvites = [];
  state.view = 'jamiya'; render();
  const ref = db.collection('jamiyat').doc(id);
  state.jUnsubs.push(
    ref.onSnapshot(s => { if (!s.exists) { toast('الجمعية غير متاحة', 'error'); state.view = 'home'; return render(); }
      state.j = { id: s.id, ...s.data() };
      if (state.j.creatorUid === state.user.uid && !state.jInviteSub) subscribeInvites(id);
      render(); }, e => toast(e.message, 'error')),
    ref.collection('members').onSnapshot(s => { state.members = {}; s.docs.forEach(d => state.members[d.id] = d.data()); if (state.view === 'jamiya') render(); }),
    ref.collection('payments').onSnapshot(s => { state.payments = s.docs.map(d => ({ id: d.id, ...d.data() })); if (state.view === 'jamiya') render(); })
  );
}
function subscribeInvites(id) {
  state.jInviteSub = true;
  state.jUnsubs.push(db.collection('invites').where('jamiyaId', '==', id).where('creatorUid', '==', state.user.uid).onSnapshot(s => {
    state.jInvites = s.docs.map(d => ({ id: d.id, ...d.data() })); if (state.view === 'jamiya') render();
  }, e => toast('خطأ في الدعوات: ' + e.message, 'error')));
}

/* ============ المدفوعات ============ */
async function submitPayment(f) {
  const c = ctx(); const amount = parseFloat(f.amount.value); const file = f.file.files[0];
  if (!(amount > 0)) return toast('المبلغ غير صحيح', 'error');
  if (!file) return toast('أرفق صورة الإيصال', 'error');

  const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'جارٍ المعالجة...';
  try {
    const dataUrl = await compressImage(file);
    const ref = db.collection('jamiyat').doc(c.j.id), pid = `${c.cur}_${state.user.uid}`;
    const batch = db.batch();
    // الصورة المضغوطة في مستند منفصل حتى لا يثقل تحميل قائمة المدفوعات
    batch.set(ref.collection('proofs').doc(pid), { uid: state.user.uid, data: dataUrl });
    batch.set(ref.collection('payments').doc(pid), {
      month: c.cur, uid: state.user.uid, name: state.profile.name, amount, ref: f.ref.value.trim(), hasProof: true,
      status: 'pending', recipientUid: c.recUid, createdAt: FV.serverTimestamp()
    });
    await batch.commit();

    if (c.rec && c.rec.email) sendMail(c.rec.email, c.rec.name, `إيصال سداد جديد - ${c.j.name}`, `رفع ${state.profile.name} إيصال سداد بقيمة ${amount} ريال لجمعية "${c.j.name}". افتح التطبيق للمراجعة والتأكيد:\n${appUrl()}`).catch(() => {});
  } catch (e) { toast('تعذر الرفع: ' + e.message, 'error'); btn.disabled = false; btn.textContent = 'إرسال الإيصال'; }
}
// ضغط الصورة في المتصفح: أقصى بُعد 1000px وجودة JPEG متدرجة حتى يقل الحجم عن ~600KB
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let scale = Math.min(1, 1000 / Math.max(img.width, img.height));
      for (let attempt = 0; attempt < 6; attempt++) {
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
        const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
        for (const q of [0.75, 0.6, 0.45]) {
          const out = cv.toDataURL('image/jpeg', q);
          if (out.length < 600000) return resolve(out);
        }
        scale *= 0.75;
      }
      reject(new Error('تعذر تصغير الصورة بما يكفي، جرّب صورة أخرى'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('تعذر قراءة الصورة')); };
    img.src = url;
  });
}

/* ===== تعديل ترتيب القبض (للمشرف) ===== */
function lockedCount(c) {
  if (c.finished) return c.turns.length;
  if (!c.started) return 0;
  return c.cur + (c.pays.length > 0 ? 1 : 0); // الأشهر الماضية، وشهر جارٍ فيه سداد، مقفلة
}
function openOrderModal() {
  const c = ctx(); if (!c || !c.isCreator) return;
  state.orderDraft = [...c.turns];
  showOrderModal();
}
function showOrderModal() {
  const c = ctx(), d = state.orderDraft, lock = lockedCount(c);
  const rows = d.map((u, i) => {
    const m = state.members[u] || { name: '...' }, locked = i < lock;
    return `<div class="flex items-center justify-between p-2.5 rounded-xl text-xs ${locked ? 'bg-slate-100 text-slate-400' : 'bg-slate-50 border border-slate-100'}">
      <div class="flex items-center gap-2"><span class="w-6 h-6 rounded-full ${locked ? 'bg-slate-200' : 'bg-emerald-100 text-emerald-800'} font-bold flex items-center justify-center">${i + 1}</span>
      <div><b>${esc(m.name)}</b><div class="text-[10px]">${fmtMonth(dayIn(c.j, i, 1))}${locked ? ' • مقفل' : ''}</div></div></div>
      ${locked ? '<i class="fa-solid fa-lock"></i>' : `<div class="flex gap-1"><button class="btn b-sec" data-act="od-up" data-i="${i}" ${i <= lock ? 'disabled' : ''}>▲</button><button class="btn b-sec" data-act="od-down" data-i="${i}" ${i >= d.length - 1 ? 'disabled' : ''}>▼</button></div>`}</div>`;
  }).join('');
  showModal('تعديل ترتيب القبض', `<div class="space-y-3">
    <p class="text-[11px] text-slate-500">حرّك الأعضاء بالأسهم. الأشهر المنتهية أو التي بدأ فيها السداد مقفلة لحماية سجل المدفوعات.</p>
    <div class="space-y-2">${rows}</div>
    <div class="flex gap-2"><button class="btn b-sec" data-act="od-shuffle"><i class="fa-solid fa-shuffle"></i> عشوائي للمتاح</button><button class="btn b-pri flex-1" data-act="od-save">حفظ الترتيب</button></div></div>`);
}
function orderMove(i, dlt) {
  const c = ctx(), d = state.orderDraft, k = i + dlt;
  if (i < lockedCount(c) || k < lockedCount(c) || k >= d.length) return;
  [d[i], d[k]] = [d[k], d[i]]; showOrderModal();
}
function orderShuffle() {
  const c = ctx(), d = state.orderDraft, lock = lockedCount(c);
  const free = d.slice(lock);
  for (let i = free.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [free[i], free[k]] = [free[k], free[i]]; }
  state.orderDraft = d.slice(0, lock).concat(free); showOrderModal();
}
async function orderSave() {
  const c = ctx();
  if (state.orderDraft.slice(0, lockedCount(c)).join() !== c.turns.slice(0, lockedCount(c)).join()) return toast('لا يمكن تغيير الأشهر المقفلة', 'error');
  try { await db.collection('jamiyat').doc(c.j.id).update({ turns: state.orderDraft }); closeModal(); toast('تم حفظ ترتيب القبض'); }
  catch (e) { toast(e.message, 'error'); }
}

async function voteMod(approve) {
  const uid = state.user.uid, r = { ...state.j.modRequest };
  r.approvals = (r.approvals || []).filter(x => x !== uid); r.rejections = (r.rejections || []).filter(x => x !== uid);

  const total = state.j.memberUids.length;
  if (r.approvals.length > total / 2) r.status = 'approved'; else if (r.rejections.length >= total / 2) r.status = 'rejected';
  try { await db.collection('jamiyat').doc(state.j.id).update({ modRequest: r }); } catch (e) { toast(e.message, 'error'); }

  const paidCount = c.turns.filter(u => ['confirmed', 'recipient'].includes(payStatus(c, u))).length;
  const collected = paidCount * j.amount, target = j.count * j.amount;
  const pct = Math.min(100, Math.round(collected / target * 100));
  const due = dayIn(j, c.cur, j.lastDay), payout = dayIn(j, c.cur, j.payDay);
  const badge = { recipient: ['المستلم', 'bg-amber-100 text-amber-800'], confirmed: ['تم السداد', 'bg-emerald-100 text-emerald-700'], pending: ['بانتظار التأكيد', 'bg-sky-100 text-sky-700'], unpaid: ['لم يسدد', 'bg-rose-100 text-rose-700'] };
  const canReorder = c.isCreator && !c.started;

  const recBox = c.finished ? `<div class="bg-slate-800 text-white p-6 rounded-3xl"><h3 class="text-lg font-black">اكتملت الجمعية 🎉</h3><p class="text-xs text-slate-300 mt-1">استلم جميع الأعضاء أدوارهم.</p></div>`
    : `<div class="bg-gradient-to-r from-amber-500 to-orange-500 text-white p-6 rounded-3xl shadow-lg"><div class="flex flex-wrap justify-between items-center gap-4">
      <div><p class="text-xs font-bold text-yellow-100">${c.started ? 'مستلم دفعة ' + fmtMonth(dayIn(j, c.cur, 1)) : 'أول مستلم (لم تبدأ الجمعية بعد)'}</p>
      <h3 class="text-xl font-black">${c.rec ? esc(c.rec.name) : 'لم يكتمل ترتيب الأعضاء'}</h3>
      ${c.rec ? `<p class="text-xs text-amber-100 mt-1">${esc(c.rec.bank)} ${c.rec.iban ? '• <span dir="ltr">' + esc(c.rec.iban) + '</span>' : ''}</p>` : ''}
      <p class="text-xs text-amber-100 mt-1">آخر موعد للسداد: ${fmtDate(due)} • الصرف: ${fmtDate(payout)}</p></div>
      <div>${c.isRec ? '<span class="px-3 py-1 bg-yellow-300 text-slate-900 text-xs font-bold rounded-xl">أنت مستلم هذا الشهر</span>'
        : !c.started || !j.memberUids.includes(uid) ? ''
        : c.myPay ? `<span class="px-3 py-1.5 bg-white/20 rounded-xl text-xs font-bold">${c.myPay.status === 'confirmed' ? 'تم تأكيد سدادك ✓' : 'إيصالك بانتظار تأكيد المستلم'}</span>`
        : '<button class="btn bg-white text-orange-600" data-act="pay-modal"><i class="fa-solid fa-file-arrow-up"></i> رفع إثبات السداد</button>'}</div></div></div>`;

  const rows = c.turns.map((u, i) => {
    const m = state.members[u] || { name: '...', email: '' };
    const st = payStatus(c, u), b = badge[st];
    const pay = c.pays.find(p => p.uid === u);
    const month = fmtMonth(dayIn(j, i, 1));
    return `<div class="p-3 bg-slate-50 border border-slate-100 rounded-xl flex flex-wrap justify-between items-center gap-2 text-xs">
      <div class="flex items-center gap-3"><span class="w-7 h-7 rounded-full bg-emerald-100 text-emerald-800 font-bold flex items-center justify-center">${i + 1}</span>
      <div><p class="font-bold">${esc(m.name)} ${u === j.creatorUid ? '<span class="text-[10px] text-indigo-600">(مشرف)</span>' : ''}</p><p class="text-[10px] text-slate-400">دوره: ${month}</p></div></div>
      <div class="flex items-center gap-2 flex-wrap">
        ${c.finished ? '' : `<span class="px-2 py-1 rounded-lg font-bold ${b[1]}">${b[0]}</span>`}
        ${pay ? `<button class="px-2 py-1 bg-indigo-50 text-indigo-600 rounded-lg" data-act="view-proof" data-id="${esc(pay.id)}"><i class="fa-solid fa-paperclip"></i> إيصال</button>` : ''}
        ${pay && pay.status === 'pending' && (c.isRec || c.isCreator) ? `<button class="btn bg-emerald-600 text-white" data-act="confirm-pay" data-id="${esc(pay.id)}">تأكيد الاستلام</button>` : ''}
      </div></div>`;
  }).join('');

  const pend = state.jInvites.filter(i => i.status === 'pending').map(i => `<div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs">
      <p class="font-bold">${esc(i.name)}</p><p class="text-slate-500 break-all" dir="ltr">${esc(i.email)}</p>
      <div class="flex gap-1.5 mt-2"><button class="btn b-sec" data-act="resend" data-id="${esc(i.id)}">إعادة إرسال</button><button class="btn b-red" data-act="cancel-inv" data-id="${esc(i.id)}">إلغاء</button></div></div>`).join('');

  const mr = j.modRequest;
  const modBox = mr ? `<div class="bg-indigo-50 border border-indigo-200 p-4 rounded-2xl text-xs space-y-2">
      <p class="font-bold text-indigo-900"><i class="fa-solid fa-circle-exclamation"></i> طلب تعديل من ${esc(mr.byName)}:</p><p class="text-indigo-800">${esc(mr.text)}</p>
      <p class="text-indigo-700">موافقون ${mr.approvals.length} • رافضون ${mr.rejections.length} من ${j.memberUids.length} • الحالة: ${{ pending: 'قيد التصويت', approved: 'مقبول (يطبّقه المشرف)', rejected: 'مرفوض' }[mr.status]}</p>
      <div class="flex gap-2 flex-wrap">${mr.status === 'pending' ? `<button class="btn bg-emerald-600 text-white" data-act="vote-yes">موافق</button><button class="btn bg-rose-600 text-white" data-act="vote-no">غير موافق</button>` : ''}
      ${c.isCreator ? '<button class="btn b-sec" data-act="close-mod">إغلاق الطلب</button>' : ''}</div></div>` : '';

  const sched = Array.from({ length: j.count }, (_, i) => {
    const u = c.turns[i], m = u && state.members[u];
    return `<div class="flex justify-between text-xs py-1.5 border-b border-slate-100 ${i === c.cur && c.started && !c.finished ? 'font-bold text-emerald-700' : ''}"><span>${i + 1}. ${fmtMonth(dayIn(j, i, 1))}</span><span>${m ? esc(m.name) : '— شاغر —'}</span></div>`;
  }).join('');

  return `<div class="space-y-5">
    <div class="card p-6 flex flex-wrap justify-between items-center gap-4">
      <div><button class="text-xs text-slate-400 mb-1" data-act="go-home">← رجوع</button><h2 class="text-2xl font-black">${esc(j.name)}</h2>
      <p class="text-xs text-slate-500 mt-1">الاشتراك ${money(j.amount)} • السداد حتى يوم ${j.lastDay} • الصرف يوم ${j.payDay} • تبدأ ${fmtDate(new Date(j.startDate + 'T00:00:00'))}</p></div>
      <div class="flex flex-wrap gap-2">
        ${c.isCreator ? `<button class="btn b-pri" data-act="invite-modal"><i class="fa-solid fa-user-plus"></i> دعوة عضو</button><button class="btn b-sec" data-act="remind"><i class="fa-solid fa-bell"></i> تذكير المتأخرين</button><button class="btn b-sec" data-act="edit-modal"><i class="fa-solid fa-gear"></i> تعديل</button>` : ''}
        <button class="btn b-sec" data-act="mod-modal"><i class="fa-solid fa-pen-to-square"></i> اقتراح تعديل</button></div></div>
    ${modBox}${recBox}
    <div class="grid md:grid-cols-3 gap-5">
      <div class="card p-5 md:col-span-2"><div class="flex justify-between items-center mb-3"><h4 class="font-bold text-sm"><i class="fa-solid fa-users text-emerald-600"></i> الأعضاء وترتيب القبض</h4>
        <span class="text-xs bg-slate-100 px-2 py-1 rounded-lg font-semibold">${c.turns.length}/${j.count}</span></div>
        ${c.isCreator && c.turns.length > 1 ? '<button class="btn b-sec mb-3" data-act="order-modal"><i class="fa-solid fa-arrow-down-1-9"></i> تعديل ترتيب القبض</button>' : ''}
        <div class="space-y-2">${rows}</div></div>
      <div class="space-y-5">
        <div class="card p-5"><h4 class="font-bold text-sm mb-3"><i class="fa-solid fa-chart-pie text-indigo-600"></i> تحصيل هذا الشهر</h4>
          <div class="text-xs space-y-2"><div class="flex justify-between"><span>المستهدف</span><b>${money(target)}</b></div><div class="flex justify-between"><span>المؤكد</span><b class="text-emerald-600">${money(collected)}</b></div>
          <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden"><div class="bg-emerald-500 h-full" style="width:${pct}%"></div></div></div></div>
        ${c.isCreator ? `<div class="card p-5"><h4 class="font-bold text-sm mb-3"><i class="fa-solid fa-clock-rotate-left text-amber-500"></i> دعوات معلّقة</h4><div class="space-y-2">${pend || '<p class="text-xs text-slate-400">لا توجد دعوات معلّقة.</p>'}</div></div>` : ''}
        <div class="card p-5"><h4 class="font-bold text-sm mb-2"><i class="fa-solid fa-calendar-days text-teal-600"></i> الجدول الزمني</h4>${sched}</div>
      </div></div></div>`;
}

function vProfile() {
  const p = state.profile;
  return `<div class="max-w-xl mx-auto card p-8 space-y-5"><div class="flex justify-between items-center"><div><h3 class="font-bold text-lg">${esc(p.name)}</h3><p class="text-xs text-slate-500" dir="ltr">${esc(p.email)}</p></div><button class="btn b-sec" data-act="go-home">الرئيسية</button></div>
    <form id="f-profile" class="space-y-3"><div><label class="text-xs font-semibold block mb-1">الاسم</label><input name="name" class="inp" value="${esc(p.name)}" required></div>${bankFields(p)}
    <button class="btn b-pri w-full py-3" type="submit">حفظ التعديلات</button></form></div>`;
}

function vAdmin() {
  const { jamiyat, users } = state.admin;
  const total = jamiyat.reduce((s, j) => s + j.count * j.amount, 0);
  const totalMembers = jamiyat.reduce((s, j) => s + (j.memberUids || []).length, 0);
  return `<div class="space-y-5"><div class="card p-6 !bg-slate-900 text-white flex flex-wrap justify-between items-center gap-3">
    <div><span class="px-3 py-1 bg-indigo-500/30 text-indigo-200 text-xs font-bold rounded-full inline-block mb-2"><i class="fa-solid fa-shield-halved"></i> لوحة المالك</span><h2 class="text-xl font-black">إدارة المنصة</h2>
    <p class="text-xs text-slate-300 mt-1" dir="ltr">${esc(state.user.email)}</p></div>
    <div class="flex gap-2 flex-wrap"><button class="btn b-sec" data-act="refresh-admin"><i class="fa-solid fa-rotate"></i> تحديث</button><button class="btn b-pri" data-act="test-mail"><i class="fa-solid fa-envelope"></i> اختبار البريد</button></div></div>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4"><div class="card p-4"><p class="text-xs text-slate-500">الجمعيات</p><h3 class="text-2xl font-black">${jamiyat.length}</h3></div>
  <div class="card p-4"><p class="text-xs text-slate-500">المستخدمون</p><h3 class="text-2xl font-black">${users.length}</h3></div>
  <div class="card p-4"><p class="text-xs text-slate-500">عضويات الجمعيات</p><h3 class="text-2xl font-black">${totalMembers}</h3></div>
  <div class="card p-4"><p class="text-xs text-slate-500">إجمالي الدورات</p><h3 class="text-lg font-black text-emerald-600">${money(total)}</h3></div></div>
  <div class="grid md:grid-cols-2 gap-5"><div class="card p-5"><h3 class="font-bold text-sm mb-3">الجمعيات</h3><div class="space-y-2 max-h-96 overflow-y-auto">${jamiyat.map(j => `<div class="p-3 bg-slate-50 rounded-xl text-xs flex justify-between items-center gap-2"><div><b>${esc(j.name)}</b><p class="text-slate-500">المشرف: ${esc(j.creatorName)} • ${(j.memberUids || []).length}/${j.count} • ${money(j.amount)}</p></div><button class="btn b-sec" data-act="open" data-id="${j.id}">فتح</button></div>`).join('') || '<p class="text-xs text-slate-400">لا توجد جمعيات.</p>'}</div></div>
  <div class="card p-5"><h3 class="font-bold text-sm mb-3">المستخدمون</h3><div class="space-y-2 max-h-96 overflow-y-auto">${users.map(u => `<div class="p-3 bg-slate-50 rounded-xl text-xs"><b>${esc(u.name)}</b><p class="text-slate-500" dir="ltr">${esc(u.email)} • ${esc(u.phone || '')}</p></div>`).join('') || '<p class="text-xs text-slate-400">لا يوجد مستخدمون.</p>'}</div></div></div></div>`;
}

/* ============ النوافذ المنبثقة ============ */
function showModal(title, body) {
  $('modal').innerHTML = `<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade"><div class="bg-white max-w-md w-full p-6 rounded-3xl shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center"><h3 class="font-bold text-lg">${title}</h3><button data-act="close" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button></div>${body}</div></div>`;
}
function closeModal() { $('modal').innerHTML = ''; }

function openModal(kind) {
  const c = ctx();
  if (kind === 'invite') showModal('دعوة عضو للجمعية', `<form id="f-invite" class="space-y-3"><div><label class="text-xs font-semibold block mb-1">اسم العضو</label><input name="name" class="inp" required></div>
    <div><label class="text-xs font-semibold block mb-1">بريده الإلكتروني (يجب أن يسجّل به)</label><input name="email" type="email" dir="ltr" class="inp" required></div>
    <button class="btn b-pri w-full py-3" type="submit">إرسال الدعوة</button></form>`);
  if (kind === 'pay') showModal('إثبات سداد القسط', `<form id="f-pay" class="space-y-3"><p class="text-xs text-slate-500">حوّل إلى: <b>${esc(c.rec?.name)}</b> — ${esc(c.rec?.bank)} <span dir="ltr">${esc(c.rec?.iban || '')}</span></p>
    <div><label class="text-xs font-semibold block mb-1">المبلغ المحوّل (ريال)</label><input name="amount" type="number" class="inp" value="${c.j.amount}" required></div>
    <div><label class="text-xs font-semibold block mb-1">صورة الإيصال (لقطة شاشة أو صورة)</label><input name="file" type="file" accept="image/*" class="inp" required></div>
    <div><label class="text-xs font-semibold block mb-1">رقم مرجع الحوالة (اختياري)</label><input name="ref" class="inp" dir="ltr"></div>
    <button class="btn b-pri w-full py-3" type="submit">إرسال الإيصال</button></form>`);
  if (kind === 'mod') showModal('اقتراح تعديل على الشروط', `<form id="f-mod" class="space-y-3"><textarea name="text" rows="3" class="inp" required placeholder="اكتب التعديل المقترح بوضوح..."></textarea>
    <p class="text-[11px] text-slate-500">يُقبل الطلب عند موافقة أكثر من نصف الأعضاء، ثم يطبّقه المشرف.</p><button class="btn b-pri w-full py-3" type="submit">إرسال للتصويت</button></form>`);
  if (kind === 'edit') showModal('تعديل إعدادات الجمعية', `<form id="f-edit" class="space-y-3"><div><label class="text-xs font-semibold block mb-1">الاسم</label><input name="jname" class="inp" value="${esc(c.j.name)}" required></div>
    <div><label class="text-xs font-semibold block mb-1">الاشتراك الشهري</label><input name="amount" type="number" class="inp" value="${c.j.amount}" required></div>
    <div class="grid grid-cols-2 gap-3"><div><label class="text-xs font-semibold block mb-1">آخر يوم للسداد</label><input name="lastDay" type="number" class="inp" value="${c.j.lastDay}" required></div>
    <div><label class="text-xs font-semibold block mb-1">يوم الصرف</label><input name="payDay" type="number" class="inp" value="${c.j.payDay}" required></div></div>
    <button class="btn b-pri w-full py-3" type="submit">حفظ</button></form>`);
}

/* ============ التوجيه والأحداث ============ */
const actions = {
  'go-home': () => { cleanup(state.jUnsubs); state.view = state.user && state.profile ? 'home' : state.view; render(); },
  'go-create': () => { state.view = 'create'; render(); },
  'go-profile': () => { state.view = 'profile'; render(); },
  'go-admin': () => { state.view = 'admin'; render(); loadAdmin(); },
  'logout': () => auth.signOut(),
  'google': doGoogle,
  'auth-register': () => { state.authMode = 'register'; render(); },
  'auth-login': () => { state.authMode = 'login'; render(); },
  'auth-reset': () => { state.authMode = 'reset'; render(); },
  'recheck': recheckVerification,
  'resend-verify': () => auth.currentUser.sendEmailVerification({ url: appUrl() }).then(() => toast('أُعيد إرسال رابط التحقق')).catch(e => toast(authErr(e), 'error')),
  'open': (el) => openJamiya(el.dataset.id),
  'accept': (el) => acceptInvite(el.dataset.id),
  'decline': (el) => declineInvite(el.dataset.id),
  'invite-modal': () => openModal('invite'), 'pay-modal': () => openModal('pay'), 'mod-modal': () => openModal('mod'), 'edit-modal': () => openModal('edit'),
  'close': closeModal,
  'confirm-pay': (el) => confirmPayment(el.dataset.id),
  'remind': remindUnpaid,
  'resend': (el) => { const i = state.jInvites.find(x => x.id === el.dataset.id); if (i) sendInviteMail({ ...i, amount: state.j.amount }); },
  'cancel-inv': (el) => db.collection('invites').doc(el.dataset.id).delete().then(() => toast('أُلغيت الدعوة', 'info')).catch(e => toast(e.message, 'error')),
  'order-modal': openOrderModal,
  'od-up': (el) => orderMove(+el.dataset.i, -1), 'od-down': (el) => orderMove(+el.dataset.i, 1),
  'od-shuffle': orderShuffle, 'od-save': orderSave,
  'view-proof': (el) => viewProof(el.dataset.id),
  'refresh-admin': loadAdmin, 'test-mail': testMail,
  'copy-invite': () => navigator.clipboard.writeText(inviteText(state.lastInvite)).then(() => toast('تم نسخ نص الدعوة')).catch(() => toast('تعذر النسخ', 'error')),
  'vote-yes': () => voteMod(true), 'vote-no': () => voteMod(false), 'close-mod': closeMod
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (fn) fn(el);
});
const forms = { 'f-register': doRegister, 'f-login': doLogin, 'f-reset': doReset, 'f-complete': doCompleteProfile, 'f-create': handleCreate,
  'f-invite': handleInvite, 'f-pay': submitPayment, 'f-mod': submitMod, 'f-edit': submitEdit, 'f-profile': saveProfile };
document.addEventListener('submit', e => { const fn = forms[e.target.id]; if (fn) { e.preventDefault(); fn(e.target); } });

render();
</script>
</body>
</html>
