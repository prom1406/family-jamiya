function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = `${type === 'error' ? 'bg-rose-600' : type === 'info' ? 'bg-slate-800' : 'bg-emerald-600'} text-white px-4 py-3 rounded-2xl shadow-xl text-xs font-bold fade max-w-xs`;
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

  };

async function sendMail(to, name, subject, message) {

}
function mailErrHint(e) {
  const raw = String((e && (e.text || e.message)) || e || 'خطأ غير معروف');
  const st = e && e.status;
  let hint = '';
  if (/recipient/i.test(raw)) hint = 'حقل "To Email" في قالب EmailJS فارغ. افتح القالب واجعله {{to_email}}.';
  else if (st === 412 || /invalid grant|authenticat|insufficient/i.test(raw)) hint = 'ربط خدمة البريد انتهى. في EmailJS ← Email Services ← أعد ربط الخدمة (Reconnect).';
  else if (st === 403 || /origin|domain|not allowed/i.test(raw)) hint = 'الدومين غير مسموح. في EmailJS ← Account ← Security أضف دومين موقعك أو عطّل التقييد.';
  else if (st === 400 || /template|service/i.test(raw)) hint = 'تحقق من Service ID وTemplate ID وPublic Key في أعلى الكود.';
  else if (st === 429 || /limit|quota/i.test(raw)) hint = 'تجاوزت حد الرسائل في باقتك (200 شهرياً في المجانية).';
  else if (st === 0 || /network|fetch/i.test(raw)) hint = 'مشكلة اتصال أو حظر من مانع إعلانات/إضافة في المتصفح.';
  return { raw: (st ? st + ' — ' : '') + raw, hint };
}

/* ============ منطق الجمعية ============ */
// أنواع الدورات: الشهرية على أساس الأشهر الميلادية، والبقية على أساس عدد ثابت من الأيام
const FREQS = {
  monthly:  { label: 'شهرية',        every: 'شهرياً',        days: 0,  unit: 'شهر' },
  tenday:   { label: 'كل 10 أيام',   every: 'كل 10 أيام',    days: 10, unit: 'دورة' },
  biweekly: { label: 'كل أسبوعين',   every: 'كل أسبوعين',    days: 14, unit: 'دورة' },
  weekly:   { label: 'أسبوعية',      every: 'أسبوعياً',      days: 7,  unit: 'أسبوع' }
};
const freqOf = j => FREQS[j && j.frequency] || FREQS.monthly;
const maxDayOf = j => freqOf(j).days || 31;
const DAY_MS = 86400000;
function monthIdx(j) { // رقم الدورة الحالية (سالب = لم تبدأ)
  const f = freqOf(j), s = new Date(j.startDate + 'T00:00:00'), n = new Date();
  if (!f.days) return (n.getFullYear() - s.getFullYear()) * 12 + n.getMonth() - s.getMonth();
  const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.floor(Math.round((today - s) / DAY_MS) / f.days);
}
function periodStart(j, idx) {
  const f = freqOf(j), s = new Date(j.startDate + 'T00:00:00');
  if (!f.days) return new Date(s.getFullYear(), s.getMonth() + idx, 1);
  return new Date(s.getFullYear(), s.getMonth(), s.getDate() + idx * f.days);
}
// يوم محدد داخل الدورة: للشهرية رقم اليوم من الشهر، ولغيرها رقم اليوم منذ بداية الدورة (1 = أول يوم)
function dayIn(j, idx, day) {
  const f = freqOf(j), first = periodStart(j, idx);
  if (!f.days) {
    const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    return new Date(first.getFullYear(), first.getMonth(), Math.min(day, last));
  }
  return new Date(first.getFullYear(), first.getMonth(), first.getDate() + Math.min(day, f.days) - 1);
}
function periodLabel(j, idx) {
  const f = freqOf(j);
  if (!f.days) return fmtMonth(periodStart(j, idx));
  const a = periodStart(j, idx), b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + f.days - 1);
  const o = { day: 'numeric', month: 'long' };
  return `${a.toLocaleDateString('ar-SA-u-ca-gregory', o)} – ${b.toLocaleDateString('ar-SA-u-ca-gregory', o)}`;
}
const r2 = n => Math.round(n * 100) / 100;
const fmtNum = n => Number(r2(n)).toLocaleString('ar-SA', { maximumFractionDigits: 2 });

// حساب العضو التراكمي: كل ما دفعه يُقسَّم على قيمة القسط الحالية.
// المستحق = (عدد الدورات حتى الآن ما عدا دور استلامه) × القسط. الزائد رصيد مقدّم يغطي الدفعات القادمة.
function accountFor(j, turns, cur, started, payments, uid, amount = j.amount) {
  const ownIdx = turns.indexOf(uid);
  let n = 0; if (started) for (let k = 0; k <= cur; k++) if (k !== ownIdx) n++;
  const owed = r2(n * amount);
  let confirmed = 0, pending = 0;
  payments.forEach(p => { if (p.uid !== uid) return; if (p.status === 'confirmed') confirmed += Number(p.amount) || 0; else pending += Number(p.amount) || 0; });
  confirmed = r2(confirmed); pending = r2(pending);
  const paid = r2(confirmed + pending), eps = 0.005;
  const remaining = r2(Math.max(0, owed - paid));
  const credit = r2(Math.max(0, paid - owed));
  let status = 'wait';
  if (started) status = confirmed >= owed - eps ? 'confirmed' : paid >= owed - eps ? 'pending' : paid > 0 ? 'partial' : 'unpaid';
  return { n, owed, confirmed, pending, paid, remaining, credit, status, covers: amount > 0 ? r2(paid / amount) : 0, mine: payments.filter(p => p.uid === uid) };
}
function ctx() {
  const j = state.j; if (!j) return null;
  const idx = monthIdx(j);
  const cur = Math.min(Math.max(idx, 0), j.count - 1);
  const turns = j.turns || [];
  const recUid = turns[cur] || null;
  const rec = recUid ? state.members[recUid] : null;
  const started = idx >= 0, finished = idx >= j.count;
  const acct = {}; turns.forEach(u => { acct[u] = accountFor(j, turns, cur, started, state.payments, u); });
  const curPays = state.payments.filter(p => p.month === cur);
  return { j, idx, cur, finished, started, turns, recUid, rec, pays: state.payments, curPays, acct,
           isCreator: j.creatorUid === state.user.uid, isRec: recUid === state.user.uid,
           me: acct[state.user.uid] || null, f: freqOf(j) };
}
function payStatus(c, uid) {
  if (uid === c.recUid) return 'recipient';
  return c.acct[uid] ? c.acct[uid].status : 'unpaid';
}
const needsPay = (c, u) => u !== c.recUid && c.acct[u] && ['unpaid', 'partial'].includes(c.acct[u].status);

/* ============ المصادقة ============ */
auth.onAuthStateChanged(async user => {
  cleanup(state.unsubs); cleanup(state.jUnsubs);
  state.user = user; state.profile = null; state.isAdmin = false;
  state.jamiyat = []; state.invites = [];
  if (!user) { state.view = 'auth'; return render(); }

  const needsVerify = !user.emailVerified && user.providerData.every(p => p.providerId === 'password');
  if (needsVerify) { state.view = 'verify'; return render(); }

  try {
    // تحديث الرمز ليحمل حالة تفعيل البريد الحالية، وإلا ترفض القواعد القراءة حتى ساعة بعد التفعيل
    if (user.emailVerified) await user.getIdToken(true).catch(() => {});
    const snap = await db.collection('users').doc(user.uid).get();
    state.profile = snap.exists ? snap.data() : null;
    const adm = await db.collection('admins').doc(user.uid).get().catch(() => ({ exists: false }));
    state.isAdmin = adm.exists || (lc(user.email) === OWNER_EMAIL && user.emailVerified);
  } catch (e) { toast('تعذر تحميل الحساب: ' + e.message, 'error'); }

  if (!state.profile) { state.view = 'complete'; return render(); }
  startListeners();
  if (state.isAdmin) { state.view = 'admin'; render(); loadAdmin(); toast('مرحباً بك في لوحة المالك', 'info'); return; }
  state.view = 'home'; render();
});

function cleanup(arr) { arr.forEach(u => u()); arr.length = 0; }

function startListeners() {
  const uid = state.user.uid, email = lc(state.user.email);
  state.unsubs.push(
    db.collection('jamiyat').where('memberUids', 'array-contains', uid).onSnapshot(s => {
      state.jamiyat = s.docs.map(d => ({ id: d.id, ...d.data() }));
      if (['home'].includes(state.view)) render();
    }, e => toast('خطأ في تحميل الجمعيات: ' + e.message, 'error')),
    db.collection('invites').where('email', '==', email).where('status', '==', 'pending').onSnapshot(s => {
      state.invites = s.docs.map(d => ({ id: d.id, ...d.data() }));
      if (state.view === 'home') render();
    }, e => toast('خطأ في تحميل الدعوات: ' + e.message, 'error'))
  );
}

async function doRegister(f) {
  const name = f.name.value.trim(), email = lc(f.email.value), pass = f.password.value;
  const phone = f.phone.value.trim(), bank = resolveBank(f), iban = fixIban(f.iban.value);
  if (bank === null) return;
  if (name.length < 3) return toast('اكتب الاسم الثلاثي', 'error');
  if (!validEmail(email)) return toast('البريد غير صحيح', 'error');
  if (pass.length < 6) return toast('كلمة المرور 6 أحرف على الأقل', 'error');
  if (!validPhone(phone)) return toast('رقم الجوال يجب أن يبدأ بـ 05 ويتكون من 10 أرقام', 'error');
  if (!bank.startsWith('كاش') && !validIban(iban)) return toast('الآيبان يجب أن يكون SA متبوعاً بـ 22 رقماً', 'error');
  if (!f.terms.checked) return toast('يجب الموافقة على الشروط', 'error');
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await cred.user.updateProfile({ displayName: name });
    await db.collection('users').doc(cred.user.uid).set({ name, email, phone, bank, iban: bank.startsWith('كاش') ? '' : iban, waOptIn: f.waOptIn.checked, avatar: '', createdAt: FV.serverTimestamp() });
    await cred.user.sendEmailVerification({ url: appUrl() });
    toast('تم إنشاء الحساب وإرسال رابط التحقق إلى بريدك');
    await auth.signOut().catch(() => {});
    state.authMode = 'login'; state.view = 'auth'; render();
    toast('فعّل بريدك من الرسالة ثم سجّل الدخول', 'info');
  } catch (e) { toast(authErr(e), 'error'); }
}
async function doLogin(f) {
  try {
    const cred = await auth.signInWithEmailAndPassword(lc(f.email.value), f.password.value);
    if (!cred.user.emailVerified) {
      await cred.user.sendEmailVerification({ url: appUrl() }).catch(() => {});
    }
  } catch (e) { toast(authErr(e), 'error'); }
}
async function doReset(f) {
  try { await auth.sendPasswordResetEmail(lc(f.email.value), { url: appUrl() }); toast('أُرسل رابط إعادة تعيين كلمة المرور إلى بريدك'); state.authMode = 'login'; render(); }
  catch (e) { toast(authErr(e), 'error'); }
}
async function doGoogle() {
  try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch (e) { toast(authErr(e), 'error'); }
}
async function doCompleteProfile(f) {
  const phone = f.phone.value.trim(), bank = resolveBank(f), iban = fixIban(f.iban.value);
  if (bank === null) return;
  if (!validPhone(phone)) return toast('رقم الجوال غير صحيح', 'error');
  if (!bank.startsWith('كاش') && !validIban(iban)) return toast('الآيبان غير صحيح', 'error');
  const u = state.user;
  const profile = { name: u.displayName || 'عضو', email: lc(u.email), phone, bank, iban: bank.startsWith('كاش') ? '' : iban, waOptIn: f.waOptIn.checked, avatar: u.photoURL || '', createdAt: FV.serverTimestamp() };
  try {
    await db.collection('users').doc(u.uid).set(profile);
    state.profile = profile; startListeners();
    if (state.isAdmin) { state.view = 'admin'; render(); loadAdmin(); } else { state.view = 'home'; render(); }
  } catch (e) { toast(e.message, 'error'); }
}
async function recheckVerification() {
  await auth.currentUser.reload();
  if (auth.currentUser.emailVerified) { await auth.currentUser.getIdToken(true); toast('تم التحقق من البريد'); location.reload(); }
  else toast('لم يتم التحقق بعد، افتح الرابط المرسل لبريدك', 'error');
}

/* ============ الدعوات ============ */
async function handleInvite(f) {
  const c = ctx(); const name = f.name.value.trim(), email = lc(f.email.value);
  if (!validEmail(email)) return toast('البريد غير صحيح', 'error');
  if (Object.values(state.members).some(m => lc(m.email) === email)) return toast('هذا الشخص عضو بالفعل', 'error');
  const pending = state.jInvites.filter(i => i.status === 'pending').length;
  if (c.j.memberUids.length + pending >= c.j.count) return toast('اكتمل عدد الأعضاء المحدد للجمعية', 'error');
  const id = `${c.j.id}__${email}`;
  try {
    await db.collection('invites').doc(id).set({
      jamiyaId: c.j.id, jamiyaName: c.j.name, amount: c.j.amount, every: freqOf(c.j).every, email, name,
      invitedBy: state.user.uid, inviterName: state.profile.name, creatorUid: c.j.creatorUid,
      status: 'pending', createdAt: FV.serverTimestamp()
    });
    closeModal(); toast('تم إنشاء الدعوة، وستظهر للمدعو فور دخوله بنفس البريد');
    sendInviteMail({ email, name, jamiyaName: c.j.name, inviterName: state.profile.name, amount: c.j.amount, every: freqOf(c.j).every });
  } catch (e) { toast('تعذر إنشاء الدعوة: ' + e.message, 'error'); }
}
function inviteText(i, forEmail = false) {
  return `السلام عليكم ${i.name}،\nدعاك ${i.inviterName} للانضمام إلى جمعية "${i.jamiyaName}" بقيمة اشتراك ${i.amount} ريال ${i.every || 'شهرياً'}.\n\nلقبول الدعوة افتح الرابط أدناه وسجّل الدخول بنفس هذا البريد (${i.email}):${forEmail ? mailLink() : '\n' + shareUrl()}`;
}
async function sendInviteMail(i) {
  state.lastInvite = i;
  try {
    await sendMail(i.email, i.name, `دعوة للانضمام إلى جمعية ${i.jamiyaName}`, inviteText(i, true));
    toast('✉️ أُرسل بريد الدعوة إلى ' + i.email);
  } catch (e) {
    const { raw, hint } = mailErrHint(e);
    console.error('EmailJS error', e);
    showModal('تعذر إرسال بريد الدعوة', `<div class="space-y-3 text-xs">
      <p class="text-slate-600">الدعوة محفوظة وستظهر لـ <b dir="ltr">${esc(i.email)}</b> داخل التطبيق عند دخوله بنفس البريد. لكن البريد لم يُرسل.</p>
      <div class="p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-800" dir="ltr">${esc(raw)}</div>
      ${hint ? `<div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-900">${esc(hint)}</div>` : ''}
      <p class="font-bold">أرسل الدعوة بطريقة أخرى:</p>
      <div class="flex gap-2 flex-wrap"><a class="btn b-pri" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(inviteText(i))}"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
      <button class="btn b-sec" data-act="copy-invite"><i class="fa-solid fa-copy"></i> نسخ نص الدعوة</button></div></div>`);
  }
}
async function acceptInvite(inviteId) {
  const inv = state.invites.find(i => i.id === inviteId); if (!inv) return;
  const uid = state.user.uid, p = state.profile;
  const batch = db.batch();
  const jRef = db.collection('jamiyat').doc(inv.jamiyaId);
  batch.update(jRef, { memberUids: FV.arrayUnion(uid), turns: FV.arrayUnion(uid) });
  batch.update(db.collection('invites').doc(inviteId), { status: 'accepted' });
  batch.set(jRef.collection('members').doc(uid), { uid, name: p.name, email: lc(state.user.email), phone: p.phone, bank: p.bank, iban: p.iban, waOptIn: p.waOptIn !== false });
  try { await batch.commit(); toast('تم الانضمام للجمعية'); } catch (e) { toast('تعذر الانضمام: ' + e.message, 'error'); }
}
async function declineInvite(inviteId) {
  try { await db.collection('invites').doc(inviteId).update({ status: 'declined' }); toast('تم رفض الدعوة', 'info'); }
  catch (e) { toast(e.message, 'error'); }
}

/* ============ إنشاء وفتح الجمعية ============ */
async function handleCreate(f) {
  const name = f.jname.value.trim(), count = parseInt(f.count.value), amount = parseFloat(f.amount.value);
  const startDate = f.start.value, lastDay = parseInt(f.lastDay.value), payDay = parseInt(f.payDay.value);
  const frequency = FREQS[f.frequency.value] ? f.frequency.value : 'monthly', maxDay = maxDayOf({ frequency });
  if (!name || !startDate) return toast('أكمل الحقول المطلوبة', 'error');
  if (!(count >= 2 && count <= 30)) return toast('عدد الأعضاء بين 2 و30', 'error');
  if (!(amount >= 1)) return toast('قيمة الاشتراك غير صحيحة', 'error');
  if (!(lastDay >= 1 && lastDay <= maxDay && payDay >= 1 && payDay <= maxDay)) return toast(`الأيام بين 1 و${maxDay}`, 'error');
  const uid = state.user.uid, p = state.profile;
  const ref = db.collection('jamiyat').doc();
  const batch = db.batch();
  batch.set(ref, { name, count, amount, frequency, startDate, lastDay, payDay, creatorUid: uid, creatorName: p.name, memberUids: [uid], turns: [uid], modRequest: null, createdAt: FV.serverTimestamp() });
  batch.set(ref.collection('members').doc(uid), { uid, name: p.name, email: lc(state.user.email), phone: p.phone, bank: p.bank, iban: p.iban, waOptIn: p.waOptIn !== false });
  try { await batch.commit(); toast('تم إنشاء الجمعية'); openJamiya(ref.id); }
  catch (e) { toast('تعذر الإنشاء: ' + e.message, 'error'); }
}

// ضغط الصورة في المتصفح: أقصى بُعد 1000px وجودة JPEG متدرجة حتى يقل الحجم عن ~600KB
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let scale = Math.min(1, 1000 / Math.max(img.width, img.height));
      for (let attempt = 0; attempt < 6; attempt++) {
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
        const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
        for (const q of [0.75, 0.6, 0.45]) {
          const out = cv.toDataURL('image/jpeg', q);
          if (out.length < 600000) return resolve(out);
        }
        scale *= 0.75;
      }
      reject(new Error('تعذر تصغير الصورة بما يكفي، جرّب صورة أخرى'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('تعذر قراءة الصورة')); };
    img.src = url;
  });
}

/* ===== تعديل ترتيب القبض (للمشرف) ===== */
function lockedCount(c) {
  if (c.finished) return c.turns.length;
  if (!c.started) return 0;
  return c.cur + (c.curPays.length > 0 ? 1 : 0); // الدورات الماضية، ودورة جارٍ فيها سداد، مقفلة
}
function openOrderModal() {
  const c = ctx(); if (!c || !c.isCreator) return;
  state.orderDraft = [...c.turns];
  showOrderModal();
}
function showOrderModal() {
  const c = ctx(), d = state.orderDraft, lock = lockedCount(c);
  const rows = d.map((u, i) => {
    const m = state.members[u] || { name: '...' }, locked = i < lock;
    return `<div class="flex items-center justify-between p-2.5 rounded-xl text-xs ${locked ? 'bg-slate-100 text-slate-400' : 'bg-slate-50 border border-slate-100'}">
      <div class="flex items-center gap-2"><span class="w-6 h-6 rounded-full ${locked ? 'bg-slate-200' : 'bg-emerald-100 text-emerald-800'} font-bold flex items-center justify-center">${i + 1}</span>
      <div><b>${esc(m.name)}</b><div class="text-[10px]">${periodLabel(c.j, i)}${locked ? ' • مقفل' : ''}</div></div></div>
      ${locked ? '<i class="fa-solid fa-lock"></i>' : `<div class="flex gap-1"><button class="btn b-sec" data-act="od-up" data-i="${i}" ${i <= lock ? 'disabled' : ''}>▲</button><button class="btn b-sec" data-act="od-down" data-i="${i}" ${i >= d.length - 1 ? 'disabled' : ''}>▼</button></div>`}</div>`;
  }).join('');
  showModal('تعديل ترتيب القبض', `<div class="space-y-3">
    <p class="text-[11px] text-slate-500">حرّك الأعضاء بالأسهم. الدورات المنتهية أو التي بدأ فيها السداد مقفلة لحماية سجل المدفوعات.</p>
    <div class="space-y-2">${rows}</div>
    <div class="flex gap-2"><button class="btn b-sec" data-act="od-shuffle"><i class="fa-solid fa-shuffle"></i> عشوائي للمتاح</button><button class="btn b-pri flex-1" data-act="od-save">حفظ الترتيب</button></div></div>`);
}
function orderMove(i, dlt) {
  const c = ctx(), d = state.orderDraft, k = i + dlt;
  if (i < lockedCount(c) || k < lockedCount(c) || k >= d.length) return;
  [d[i], d[k]] = [d[k], d[i]]; showOrderModal();
}
function orderShuffle() {
  const c = ctx(), d = state.orderDraft, lock = lockedCount(c);
  const free = d.slice(lock);
  for (let i = free.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [free[i], free[k]] = [free[k], free[i]]; }
  state.orderDraft = d.slice(0, lock).concat(free); showOrderModal();
}
async function orderSave() {
  const c = ctx();
  if (state.orderDraft.slice(0, lockedCount(c)).join() !== c.turns.slice(0, lockedCount(c)).join()) return toast('لا يمكن تغيير الدورات المقفلة', 'error');
  try { await db.collection('jamiyat').doc(c.j.id).update({ turns: state.orderDraft }); closeModal(); toast('تم حفظ ترتيب القبض'); }
  catch (e) { toast(e.message, 'error'); }
}

async function voteMod(approve) {
  const uid = state.user.uid, r = { ...state.j.modRequest };
  r.approvals = (r.approvals || []).filter(x => x !== uid); r.rejections = (r.rejections || []).filter(x => x !== uid);
  (approve ? r.approvals : r.rejections).push(uid);
  const total = state.j.memberUids.length;
  if (r.approvals.length > total / 2) r.status = 'approved'; else if (r.rejections.length >= total / 2) r.status = 'rejected';
  try { await db.collection('jamiyat').doc(state.j.id).update({ modRequest: r }); } catch (e) { toast(e.message, 'error'); }
}
async function closeMod() { try { await db.collection('jamiyat').doc(state.j.id).update({ modRequest: null }); } catch (e) { toast(e.message, 'error'); } }
function editLocked(c) { return c.started || state.payments.length > 0; } // تغيير الدورية يُقفل بعد البدء أو أول دفعة
async function submitEdit(f) {
  const c = ctx(), minCount = Math.max(2, c.j.memberUids.length, c.started ? c.cur + 1 : 2);
  const upd = { name: f.jname.value.trim(), count: parseInt(f.count.value), amount: parseFloat(f.amount.value), lastDay: parseInt(f.lastDay.value), payDay: parseInt(f.payDay.value) };
  if (!editLocked(c) && FREQS[f.frequency.value]) upd.frequency = f.frequency.value;
  const maxDay = maxDayOf({ frequency: upd.frequency || c.j.frequency });
  if (!(upd.count >= minCount && upd.count <= 30)) return toast(`عدد الأعضاء يجب أن يكون بين ${minCount} و30 (لا يقل عن الأعضاء الحاليين أو الدورات المنقضية)`, 'error');
  if (!upd.name || !(upd.amount > 0) || !(upd.lastDay >= 1 && upd.lastDay <= maxDay) || !(upd.payDay >= 1 && upd.payDay <= maxDay)) return toast(`قيم غير صحيحة (الأيام بين 1 و${maxDay})`, 'error');
  if (upd.amount !== c.j.amount && state.payments.length > 0) { state.pendingEdit = upd; return showRepriceModal(c, upd); }
  await saveEdit(upd);
}
async function saveEdit(upd) {
  const j = state.j, patch = { ...upd };
  if (upd.amount !== j.amount) patch.amountHistory = [...(j.amountHistory || []), { from: j.amount, to: upd.amount, at: Date.now(), by: state.profile.name }];
  try { await db.collection('jamiyat').doc(j.id).update(patch); state.pendingEdit = null; closeModal(); toast('تم حفظ التعديلات'); } catch (e) { toast(e.message, 'error'); }
}
// معاينة: كيف تُقسَّم مدفوعات كل عضو على القيمة الجديدة قبل الحفظ

  const j = c.j, newJ = { ...j, ...upd };

      <div>المستحق حتى الآن: ${fmtNum(nw.owed)} ريال • ${res}</div></div>`;

    <p class="text-slate-600">القيمة تتغير من <b>${fmtNum(j.amount)}</b> إلى <b>${fmtNum(upd.amount)}</b> ريال. يُحتسب كل ما دفعه كل عضو ويُقسَّم على القيمة الجديدة، ويبقى الفائض رصيداً يُخصم من الدفعات القادمة.</p>

    <div class="flex gap-2"><button class="btn b-sec flex-1" data-act="close">إلغاء</button><button class="btn b-pri flex-1" data-act="confirm-edit">تأكيد وحفظ</button></div></div>`);
}

async function saveProfile(f) {
  const bank = resolveBank(f); if (bank === null) return;
  const upd = { name: f.name.value.trim(), phone: f.phone.value.trim(), bank, iban: fixIban(f.iban.value), waOptIn: f.waOptIn.checked };
  if (upd.name.length < 3) return toast('الاسم قصير', 'error');
  if (!validPhone(upd.phone)) return toast('رقم الجوال غير صحيح', 'error');
  if (!upd.bank.startsWith('كاش') && !validIban(upd.iban)) return toast('الآيبان غير صحيح', 'error');
  if (upd.bank.startsWith('كاش')) upd.iban = '';
  try {
    await db.collection('users').doc(state.user.uid).update(upd);
    state.profile = { ...state.profile, ...upd };
    await Promise.all(state.jamiyat.map(j => db.collection('jamiyat').doc(j.id).collection('members').doc(state.user.uid).set({ uid: state.user.uid, name: upd.name, email: lc(state.user.email), phone: upd.phone, bank: upd.bank, iban: upd.iban, waOptIn: upd.waOptIn }).catch(() => {})));
    toast('تم الحفظ'); render();
  } catch (e) { toast(e.message, 'error'); }
}

function resolveBank(f) {

  if (b === OTHER_BANK) { b = (f.bankOther.value || '').trim(); if (b.length < 2) { toast('اكتب اسم البنك', 'error'); return null; } }
  return b;

function bankFields(p = {}) {
  const known = BANKS.includes(p.bank), sel = known ? p.bank : (p.bank ? OTHER_BANK : undefined);
  return `<div><label class="text-xs font-semibold block mb-1">رقم الجوال (05xxxxxxxx)</label><input name="phone" class="inp" inputmode="numeric" value="${esc(p.phone)}" placeholder="05xxxxxxxx"></div>
  <div><label class="text-xs font-semibold block mb-1">البنك</label><select name="bank" class="inp">${bankOpts(sel)}</select>
    <div data-other class="${sel === OTHER_BANK ? '' : 'hide'} mt-2"><input name="bankOther" class="inp" placeholder="اكتب اسم البنك أو المحفظة" value="${esc(known ? '' : p.bank)}"></div></div>
  <div><label class="text-xs font-semibold block mb-1">الآيبان (SA + 22 رقماً) — اتركه فارغاً للكاش</label><input name="iban" class="inp" dir="ltr" value="${esc(p.iban)}" placeholder="SA0000000000000000000000"></div>
  <label class="flex items-start gap-2 text-xs"><input type="checkbox" name="waOptIn" class="mt-0.5" ${p.waOptIn !== false ? 'checked' : ''}> <span>أوافق على استلام تنبيهات السداد والدعوات عبر واتساب على رقم الجوال أعلاه</span></label>`;
}

function vVerify() {

function vComplete() {

    <p class="text-xs text-slate-500 text-center mb-5">مرحباً ${esc(state.user.displayName || '')}، نحتاج بيانات الجوال والتحويل البنكي لتستلم دورك.</p>

function vHome() {
  const inv = state.invites.map(i => `<div class="p-4 bg-amber-50 border border-amber-200 rounded-2xl flex flex-wrap justify-between items-center gap-3 text-xs">
      <div><p class="font-bold text-sm">${esc(i.jamiyaName)}</p><p class="text-slate-500">دعوة من ${esc(i.inviterName)} • الاشتراك ${money(i.amount)} ${esc(i.every || 'شهرياً')}</p></div>
      <div class="flex gap-2"><button class="btn b-pri" data-act="accept" data-id="${esc(i.id)}">قبول</button><button class="btn b-red" data-act="decline" data-id="${esc(i.id)}">رفض</button></div></div>`).join('');
  const js = state.jamiyat.map(j => `<div class="p-4 bg-white border border-slate-200 rounded-2xl flex justify-between items-center gap-3">
      <div><h4 class="font-bold text-sm">${esc(j.name)}</h4><p class="text-xs text-slate-500 mt-0.5">${money(j.amount)} ${freqOf(j).every} • ${j.memberUids.length}/${j.count} أعضاء</p>
      <span class="text-[10px] ${j.creatorUid === state.user.uid ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700'} px-2 py-0.5 rounded-md font-bold inline-block mt-1">${j.creatorUid === state.user.uid ? 'مشرف الجمعية' : 'عضو'}</span></div>
      <button class="btn b-pri" data-act="open" data-id="${j.id}">دخول</button></div>`).join('');
  return `<div class="space-y-5">
    <div class="card p-6 flex flex-wrap justify-between items-center gap-3"><div><h2 class="text-xl font-black">أهلاً ${esc(state.profile.name)}</h2><p class="text-xs text-slate-500 mt-1">جمعياتك ودعواتك في مكان واحد</p></div>
      <button class="btn b-pri py-3" data-act="go-create"><i class="fa-solid fa-circle-plus"></i> إنشاء جمعية جديدة</button></div>
    ${inv ? `<div class="space-y-2"><h3 class="font-bold text-sm"><i class="fa-solid fa-envelope-open-text text-amber-500"></i> دعوات بانتظارك</h3>${inv}</div>` : ''}
    <div class="space-y-2"><h3 class="font-bold text-sm">جمعياتك</h3>${js || '<div class="card p-8 text-center text-xs text-slate-400">لا توجد جمعيات بعد. أنشئ جمعيتك الأولى أو انتظر دعوة.</div>'}</div></div>`;
}

function dayLabels(freq) {
  const f = FREQS[freq] || FREQS.monthly;
  return f.days ? { last: `آخر يوم للسداد (من 1 إلى ${f.days}: يوم الدورة)`, pay: `يوم الصرف (من 1 إلى ${f.days}: يوم الدورة)`, max: f.days }
                : { last: 'آخر يوم للسداد كل شهر (1–31)', pay: 'يوم الصرف من الشهر (1–31)', max: 31 };
}
function freqOpts(sel) { return Object.entries(FREQS).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${v.label}</option>`).join(''); }
function vCreate() {
  const dl = dayLabels('monthly');
  return `<div class="max-w-xl mx-auto card p-8"><div class="flex justify-between items-center mb-5"><h3 class="text-xl font-bold">إنشاء جمعية جديدة</h3><button data-act="go-home" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button></div>
  <form id="f-create" class="space-y-4">

    <div><label class="text-xs font-semibold block mb-1">نوع الجمعية (مدة الدورة)</label><select name="frequency" class="inp" data-freq>${freqOpts('monthly')}</select></div>
    <div class="grid md:grid-cols-2 gap-4"><div><label class="text-xs font-semibold block mb-1">عدد الأعضاء (يساوي عدد الدورات)</label><input name="count" type="number" min="2" max="30" class="inp" required></div>
    <div><label class="text-xs font-semibold block mb-1">قيمة القسط لكل دورة (ريال)</label><input name="amount" type="number" min="1" class="inp" required></div></div>
    <div class="grid md:grid-cols-3 gap-4"><div><label class="text-xs font-semibold block mb-1">تاريخ البداية</label><input name="start" type="date" class="inp" required></div>
    <div><label class="text-xs font-semibold block mb-1" data-lbl-last>${dl.last}</label><input name="lastDay" type="number" min="1" max="${dl.max}" class="inp" required></div>
    <div><label class="text-xs font-semibold block mb-1" data-lbl-pay>${dl.pay}</label><input name="payDay" type="number" min="1" max="${dl.max}" class="inp" required></div></div>
    <button class="btn b-pri w-full py-3" type="submit">إنشاء الجمعية</button></form></div>`;
}

function vJamiya() {
  const c = ctx(); if (!c) return vLoading();
  const { j } = c, uid = state.user.uid;
  const paidCount = c.turns.filter(u => ['confirmed', 'recipient'].includes(payStatus(c, u))).length, me = c.me;
  const collected = paidCount * j.amount, target = j.count * j.amount;
  const pct = Math.min(100, Math.round(collected / target * 100));
  const due = dayIn(j, c.cur, j.lastDay), payout = dayIn(j, c.cur, j.payDay);
  const badge = { recipient: ['المستلم', 'bg-amber-100 text-amber-800'], confirmed: ['تم السداد', 'bg-emerald-100 text-emerald-700'], pending: ['بانتظار التأكيد', 'bg-sky-100 text-sky-700'], partial: ['سداد جزئي', 'bg-orange-100 text-orange-700'], unpaid: ['لم يسدد', 'bg-rose-100 text-rose-700'], wait: ['لم تبدأ', 'bg-slate-100 text-slate-500'] };
  const canReorder = c.isCreator && !c.started;

  const recBox = c.finished ? `<div class="bg-slate-800 text-white p-6 rounded-3xl"><h3 class="text-lg font-black">اكتملت الجمعية 🎉</h3><p class="text-xs text-slate-300 mt-1">استلم جميع الأعضاء أدوارهم.</p></div>`
    : `<div class="bg-gradient-to-r from-amber-500 to-orange-500 text-white p-6 rounded-3xl shadow-lg"><div class="flex flex-wrap justify-between items-center gap-4">

  const mr = j.modRequest;
  const modBox = mr ? `<div class="bg-indigo-50 border border-indigo-200 p-4 rounded-2xl text-xs space-y-2">
      <p class="font-bold text-indigo-900"><i class="fa-solid fa-circle-exclamation"></i> طلب تعديل من ${esc(mr.byName)}:</p><p class="text-indigo-800">${esc(mr.text)}</p>

      <p class="text-xs text-slate-500 mt-1">${freqOf(j).label} • القسط ${money(j.amount)} • السداد حتى يوم ${j.lastDay}${freqOf(j).days ? ' من الدورة' : ''} • الصرف يوم ${j.payDay}${freqOf(j).days ? ' من الدورة' : ''} • تبدأ ${fmtDate(new Date(j.startDate + 'T00:00:00'))}</p></div>
      <div class="flex flex-wrap gap-2">
        ${c.isCreator ? `<button class="btn b-pri" data-act="invite-modal"><i class="fa-solid fa-user-plus"></i> دعوة عضو</button><button class="btn b-sec" data-act="remind"><i class="fa-solid fa-bell"></i> تذكير بالبريد</button><button class="btn bg-emerald-50 text-emerald-700" data-act="wa-remind"><i class="fa-brands fa-whatsapp"></i> تذكير واتساب</button><button class="btn b-sec" data-act="edit-modal"><i class="fa-solid fa-gear"></i> تعديل</button>` : ''}
        <button class="btn b-sec" data-act="mod-modal"><i class="fa-solid fa-pen-to-square"></i> اقتراح تعديل</button></div></div>

        <span class="text-xs bg-slate-100 px-2 py-1 rounded-lg font-semibold">${c.turns.length}/${j.count}</span></div>
        ${c.isCreator && c.turns.length > 1 ? '<button class="btn b-sec mb-3" data-act="order-modal"><i class="fa-solid fa-arrow-down-1-9"></i> تعديل ترتيب القبض</button>' : ''}
        <div class="space-y-2">${rows}</div></div>
      <div class="space-y-5">
        <div class="card p-5"><h4 class="font-bold text-sm mb-3"><i class="fa-solid fa-chart-pie text-indigo-600"></i> تحصيل هذه الدورة</h4>
          <div class="text-xs space-y-2"><div class="flex justify-between"><span>المستهدف</span><b>${money(target)}</b></div><div class="flex justify-between"><span>المؤكد</span><b class="text-emerald-600">${money(collected)}</b></div>
          <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden"><div class="bg-emerald-500 h-full" style="width:${pct}%"></div></div></div></div>
        ${c.isCreator ? `<div class="card p-5"><h4 class="font-bold text-sm mb-3"><i class="fa-solid fa-clock-rotate-left text-amber-500"></i> دعوات معلّقة</h4><div class="space-y-2">${pend || '<p class="text-xs text-slate-400">لا توجد دعوات معلّقة.</p>'}</div></div>` : ''}
        <div class="card p-5"><h4 class="font-bold text-sm mb-2"><i class="fa-solid fa-calendar-days text-teal-600"></i> الجدول الزمني</h4>${sched}</div>
      </div></div></div>`;
}

/* ============ النوافذ المنبثقة ============ */
function showModal(title, body) {
  $('modal').innerHTML = `<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade"><div class="bg-white max-w-md w-full p-6 rounded-3xl shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center"><h3 class="font-bold text-lg">${title}</h3><button data-act="close" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button></div>${body}</div></div>`;
}
function closeModal() { $('modal').innerHTML = ''; }

function openModal(kind) {
  const c = ctx();
  if (kind === 'invite') showModal('دعوة عضو للجمعية', `<form id="f-invite" class="space-y-3"><div><label class="text-xs font-semibold block mb-1">اسم العضو</label><input name="name" class="inp" required></div>
    <div><label class="text-xs font-semibold block mb-1">بريده الإلكتروني (يجب أن يسجّل به)</label><input name="email" type="email" dir="ltr" class="inp" required></div>
    <button class="btn b-pri w-full py-3" type="submit">إرسال الدعوة</button></form>`);
  if (kind === 'pay') showModal('إثبات سداد القسط', `<form id="f-pay" class="space-y-3"><p class="text-xs text-slate-500">حوّل إلى: <b>${esc(c.rec?.name)}</b> — ${esc(c.rec?.bank)} <span dir="ltr">${esc(c.rec?.iban || '')}</span></p>
    <div class="p-2.5 bg-slate-50 rounded-xl text-[11px] text-slate-600">القسط ${fmtNum(c.j.amount)} ريال ${c.f.every} • المستحق عليك حتى الآن ${fmtNum(c.me?.owed || 0)} • المتبقي <b>${fmtNum(c.me?.remaining || 0)}</b> ريال</div>
    <div><label class="text-xs font-semibold block mb-1">المبلغ المحوّل (ريال) — يمكنك دفع جزء أو أكثر من قسط</label><input name="amount" type="number" step="0.01" min="1" class="inp" value="${c.me && c.me.remaining > 0 ? c.me.remaining : c.j.amount}" required></div>
    <div><label class="text-xs font-semibold block mb-1">صورة الإيصال (لقطة شاشة أو صورة)</label><input name="file" type="file" accept="image/*" class="inp" required></div>
    <div><label class="text-xs font-semibold block mb-1">رقم مرجع الحوالة (اختياري)</label><input name="ref" class="inp" dir="ltr"></div>
    <button class="btn b-pri w-full py-3" type="submit">إرسال الإيصال</button></form>`);
  if (kind === 'mod') showModal('اقتراح تعديل على الشروط', `<form id="f-mod" class="space-y-3"><textarea name="text" rows="3" class="inp" required placeholder="اكتب التعديل المقترح بوضوح..."></textarea>
    <p class="text-[11px] text-slate-500">يُقبل الطلب عند موافقة أكثر من نصف الأعضاء، ثم يطبّقه المشرف.</p><button class="btn b-pri w-full py-3" type="submit">إرسال للتصويت</button></form>`);
  if (kind === 'edit') {
    const minCount = Math.max(2, c.j.memberUids.length, c.started ? c.cur + 1 : 2), locked = editLocked(c), dl = dayLabels(c.j.frequency);
    showModal('تعديل إعدادات الجمعية', `<form id="f-edit" class="space-y-3"><div><label class="text-xs font-semibold block mb-1">الاسم</label><input name="jname" class="inp" value="${esc(c.j.name)}" required></div>
    <div><label class="text-xs font-semibold block mb-1">نوع الجمعية (مدة الدورة)</label><select name="frequency" class="inp" data-freq ${locked ? 'disabled' : ''}>${freqOpts(c.j.frequency || 'monthly')}</select>
      ${locked ? '<p class="text-[11px] text-slate-500 mt-1">لا يمكن تغيير مدة الدورة بعد بدء الجمعية أو تسجيل أول دفعة، حتى لا يختل الجدول.</p>' : ''}</div>
    <div class="grid grid-cols-2 gap-3"><div><label class="text-xs font-semibold block mb-1">عدد الأعضاء (الدورات)</label><input name="count" type="number" min="${minCount}" max="30" class="inp" value="${c.j.count}" required></div>
    <div><label class="text-xs font-semibold block mb-1">قيمة القسط (ريال)</label><input name="amount" type="number" step="0.01" class="inp" value="${c.j.amount}" required></div></div>
    <p class="text-[11px] text-slate-500">أقل عدد ممكن الآن: ${minCount}. عند تغيير قيمة القسط بعد وجود مدفوعات، يُعاد احتساب مدفوعات كل عضو وتقسيمها على القيمة الجديدة وتراها قبل الحفظ.</p>
    <div class="grid grid-cols-2 gap-3"><div><label class="text-xs font-semibold block mb-1" data-lbl-last>${dl.last}</label><input name="lastDay" type="number" min="1" max="${dl.max}" class="inp" value="${c.j.lastDay}" required></div>
    <div><label class="text-xs font-semibold block mb-1" data-lbl-pay>${dl.pay}</label><input name="payDay" type="number" min="1" max="${dl.max}" class="inp" value="${c.j.payDay}" required></div></div>
    <button class="btn b-pri w-full py-3" type="submit">حفظ</button></form>`);
  }
}

// قائمة مدفوعات عضو (للمراجعة والتأكيد)
function openMemberPays(uid) {
  const c = ctx(), m = state.members[uid] || { name: '...' }, ac = c.acct[uid]; if (!ac) return;
  const list = [...ac.mine].sort((a, b) => (a.month - b.month) || String(a.id).localeCompare(String(b.id)));
  const stB = { confirmed: ['مؤكدة', 'bg-emerald-100 text-emerald-700'], pending: ['بانتظار التأكيد', 'bg-sky-100 text-sky-700'] };
  const rows = list.map(p => {
    const b = stB[p.status] || stB.pending, canConfirm = p.status === 'pending' && (p.recipientUid === state.user.uid || c.isCreator);
    return `<div class="p-2.5 bg-slate-50 border border-slate-100 rounded-xl text-[11px] flex flex-wrap justify-between items-center gap-2">
      <div><b>${fmtNum(p.amount)} ريال</b> <span class="px-1.5 py-0.5 rounded ${b[1]} font-bold">${b[0]}</span>
      <div class="text-slate-500">دورة ${esc(periodLabel(c.j, p.month))}${p.ref ? ' • مرجع: ' + esc(p.ref) : ''}</div></div>
      <div class="flex gap-1.5">${p.hasProof ? `<button class="btn b-sec" data-act="view-proof" data-id="${esc(p.id)}">إيصال</button>` : ''}${canConfirm ? `<button class="btn bg-emerald-600 text-white" data-act="confirm-pay" data-id="${esc(p.id)}">تأكيد الاستلام</button>` : ''}</div></div>`;
  }).join('');
  showModal(`مدفوعات ${esc(m.name)}`, `<div class="space-y-2"><div class="text-[11px] text-slate-600">مدفوع ${fmtNum(ac.paid)} من المستحق ${fmtNum(ac.owed)} ريال${ac.credit > 0 ? ` • رصيد مقدّم ${fmtNum(ac.credit)}` : ac.remaining > 0 ? ` • متبقي ${fmtNum(ac.remaining)}` : ''}</div>${rows || '<p class="text-xs text-slate-400">لا توجد مدفوعات.</p>'}</div>`);
}

  'google': doGoogle,
  'auth-register': () => { state.authMode = 'register'; render(); },
  'auth-login': () => { state.authMode = 'login'; render(); },
  'auth-reset': () => { state.authMode = 'reset'; render(); },
  'recheck': recheckVerification,
  'resend-verify': () => auth.currentUser.sendEmailVerification({ url: appUrl() }).then(() => toast('أُعيد إرسال رابط التحقق')).catch(e => toast(authErr(e), 'error')),
  'open': (el) => openJamiya(el.dataset.id),
  'accept': (el) => acceptInvite(el.dataset.id),
  'decline': (el) => declineInvite(el.dataset.id),

  'close': closeModal,
  'confirm-pay': (el) => confirmPayment(el.dataset.id),
  'member-pays': (el) => openMemberPays(el.dataset.uid),

  'order-modal': openOrderModal,
  'wa-remind': openWaReminders, 'share-app': shareApp,
  'copy-share': () => navigator.clipboard.writeText(state.shareText).then(() => toast('تم نسخ الرابط')).catch(() => toast('تعذر النسخ', 'error')),
  'od-up': (el) => orderMove(+el.dataset.i, -1), 'od-down': (el) => orderMove(+el.dataset.i, 1),
  'od-shuffle': orderShuffle, 'od-save': orderSave,
  'view-proof': (el) => viewProof(el.dataset.id),
  'refresh-admin': loadAdmin, 'test-mail': testMail,
  'copy-invite': () => navigator.clipboard.writeText(inviteText(state.lastInvite)).then(() => toast('تم نسخ نص الدعوة')).catch(() => toast('تعذر النسخ', 'error')),
  'vote-yes': () => voteMod(true), 'vote-no': () => voteMod(false), 'close-mod': closeMod
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (fn) fn(el);
});
document.addEventListener('change', e => {
  if (e.target.matches && e.target.matches('select[data-freq]') && e.target.form) {
    const dl = dayLabels(e.target.value), fm = e.target.form;
    const l1 = fm.querySelector('[data-lbl-last]'), l2 = fm.querySelector('[data-lbl-pay]');
    if (l1) l1.textContent = dl.last; if (l2) l2.textContent = dl.pay;
    ['lastDay', 'payDay'].forEach(n => { if (fm[n]) fm[n].max = dl.max; });
  }
  if (e.target.name === 'bank' && e.target.form) {
    const box = e.target.form.querySelector('[data-other]');
    if (box) box.classList.toggle('hide', e.target.value !== OTHER_BANK);
  }
});
const forms = { 'f-register': doRegister, 'f-login': doLogin, 'f-reset': doReset, 'f-complete': doCompleteProfile, 'f-create': handleCreate,
  'f-invite': handleInvite, 'f-pay': submitPayment, 'f-mod': submitMod, 'f-edit': submitEdit, 'f-profile': saveProfile };
document.addEventListener('submit', e => { const fn = forms[e.target.id]; if (fn) { e.preventDefault(); fn(e.target); } });

render();
</script>
</body>
</html>
