<style>
:root{--brand:#0d9488;--brand-2:#059669;--ink:#0f172a;--bg:#f3f6f5;--tab-h:64px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,-apple-system,sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh;overscroll-behavior-y:none;
  background:radial-gradient(900px 420px at 100% -8%,#d1fae5 0,transparent 60%),radial-gradient(800px 380px at -10% 0,#ccfbf1 0,transparent 55%),var(--bg);background-attachment:fixed;
  padding-bottom:calc(var(--tab-h) + var(--sab) + 16px)}
@media(min-width:768px){body{padding-bottom:28px}}
body.standalone{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.standalone input,body.standalone textarea,body.standalone .sel{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none}

/* الرأس */
.app-header{position:sticky;top:0;z-index:40;padding-top:var(--sat);background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid rgba(226,232,240,.7)}
.app-header .logo{width:38px;height:38px;border-radius:12px;box-shadow:0 2px 10px rgba(13,148,136,.25);object-fit:cover}

/* البطاقات */
.card{background:rgba(255,255,255,.94);border:1px solid rgba(226,232,240,.9);border-radius:1.4rem;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.12)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{animation:fade .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}

/* الحقول والأزرار */
.inp{width:100%;min-height:48px;padding:.7rem 1rem;border:1.5px solid #e2e8f0;border-radius:.95rem;font-size:16px;background:#f8fafc;transition:.15s;font-family:inherit}
.inp:focus{outline:none;border-color:#10b981;background:#fff;box-shadow:0 0 0 4px rgba(16,185,129,.15)}
textarea.inp{min-height:96px}
.btn{min-height:42px;padding:.55rem 1rem;border-radius:.95rem;font-weight:800;font-size:.8rem;transition:transform .12s,filter .15s,background .15s;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-family:inherit;border:0;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hide{display:none!important}
.b-pri{background:linear-gradient(135deg,#059669,#0d9488);color:#fff;box-shadow:0 6px 16px -6px rgba(5,150,105,.55)}.b-pri:hover{filter:brightness(.95)}
.b-sec{background:#eef2f6;color:#334155}.b-sec:hover{background:#e2e8f0}
.b-red{background:#fff1f2;color:#e11d48}.b-red:hover{background:#ffe4e6}
.b-white{background:#fff;color:#047857;box-shadow:0 6px 16px -8px rgba(0,0,0,.35)}

/* الواجهة الرئيسية */
.hero{position:relative;overflow:hidden;color:#fff;border-radius:1.6rem;padding:1.4rem;background:linear-gradient(135deg,#059669 0%,#0d9488 55%,#0f766e 100%);box-shadow:0 16px 36px -16px rgba(13,148,136,.65)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.hero::before{width:180px;height:180px;top:-70px;left:-50px}.hero::after{width:120px;height:120px;bottom:-50px;right:30%}
.hero>*{position:relative;z-index:1}
.stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:1rem;padding:.6rem .9rem;min-width:5.5rem}
.jcard{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:1rem;background:#fff;border:1px solid #e8edf2;border-radius:1.3rem;box-shadow:0 6px 18px -14px rgba(15,23,42,.35);transition:transform .15s,box-shadow .15s;cursor:pointer}
.jcard:active{transform:scale(.985)}
.jicon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;font-size:1.15rem;color:#fff;background:linear-gradient(135deg,#10b981,#0d9488)}
.bar{height:6px;border-radius:99px;background:#e2e8f0;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#14b8a6);border-radius:99px}

/* شرائط الأزرار القابلة للتمرير في الجوال */
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chips .btn{flex:1 1 28%;min-width:0;min-height:38px;padding:.4rem .35rem;font-size:.72rem;gap:.3rem}
@media(min-width:768px){.chips .btn{flex:none;min-height:42px;padding:.55rem 1rem;font-size:.8rem}}

/* شريط التنقل السفلي (الجوال) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;height:calc(var(--tab-h) + var(--sab));padding-bottom:var(--sab);background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid #e2e8f0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:800;color:#64748b;background:none;border:0;cursor:pointer;font-family:inherit;position:relative}
.tab i{font-size:19px;transition:transform .2s}
.tab.on{color:var(--brand)}.tab.on i{transform:translateY(-1px) scale(1.12)}
.tab.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}
@media(min-width:768px){.tabbar{display:none!important}.dnav{display:flex!important}}
.dnav{display:none;align-items:center;gap:.4rem}

/* النوافذ المنبثقة */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1rem}
.sheet{background:#fff;width:100%;max-width:28rem;max-height:90vh;max-height:90dvh;overflow-y:auto;padding:1.4rem;border-radius:1.6rem;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);-webkit-overflow-scrolling:touch}
@media(max-width:639px){
  .sheet-wrap{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:1.6rem 1.6rem 0 0;padding-bottom:calc(1.4rem + var(--sab));animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
  .sheet::before{content:"";display:block;width:42px;height:4px;border-radius:9px;background:#cbd5e1;margin:-.4rem auto .9rem}
}

/* التنبيهات */
.toasts{position:fixed;z-index:80;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 66px);width:min(92vw,24rem);display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.toast{color:#fff;padding:.8rem 1rem;border-radius:1rem;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);font-size:.8rem;font-weight:700;pointer-events:auto;transition:opacity .3s}
.toast.success{background:#059669}.toast.error{background:#e11d48}.toast.info{background:#1e293b}

/* شريط التثبيت */
.ibar{position:fixed;z-index:44;left:.75rem;right:.75rem;bottom:calc(var(--tab-h) + var(--sab) + 10px);display:flex;align-items:center;gap:.75rem;padding:.7rem .8rem;background:#0f172a;color:#fff;border-radius:1.2rem;box-shadow:0 18px 40px -12px rgba(0,0,0,.55)}
.ibar img{width:40px;height:40px;border-radius:11px;flex:none;background:#fff}
.ibar .x{background:none;border:0;color:#94a3b8;padding:.35rem;cursor:pointer}
@media(min-width:768px){.ibar{bottom:1rem;max-width:30rem;margin-inline:auto}}

/* خطوط أوضح في الجوال */
@media(max-width:639px){
  body .text-xs{font-size:.8rem;line-height:1.25rem}
  body [class*="text-[11px]"]{font-size:.75rem}
  body [class*="text-[10px]"]{font-size:.7rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#print-root{display:none}
@media print{body>*:not(#print-root){display:none!important}#print-root{display:block!important}@page{margin:12mm}}

/* ===== ثيم عصري: ألوان هادئة وأزرار وبطاقات أنعم ===== */

.jcard{border:1px solid rgba(255,255,255,.85);border-radius:1.5rem;background:rgba(255,255,255,.9);box-shadow:0 14px 30px -20px rgba(15,60,70,.4);animation:fade .4s cubic-bezier(.2,.8,.2,1) both}
.jcard:hover{transform:translateY(-2px);box-shadow:0 18px 36px -18px rgba(15,60,70,.45)}
.jcard:nth-child(2){animation-delay:.05s}.jcard:nth-child(3){animation-delay:.1s}.jcard:nth-child(4){animation-delay:.15s}
.jicon{border-radius:16px;box-shadow:0 8px 16px -8px rgba(15,157,143,.6)}

.jcard:nth-child(4n+4) .jicon{background:linear-gradient(135deg,#fb7185,#e11d48);box-shadow:0 8px 16px -8px rgba(225,29,72,.55)}

@media(max-width:639px){.sheet{border-radius:1.9rem 1.9rem 0 0}.sheet::before{background:#d3dfe2}}

.emo{width:40px;height:40px;border-radius:12px;background:#f1f5f9;font-size:1.2rem;border:1.5px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}

<script>
/* ============ الإعدادات ============ */
const firebaseConfig = {
  apiKey: "AIzaSyBD_a9TrhsCL5ognnIxhv2OuyiWJmdr33o",
  authDomain: "aljamiyahapp.firebaseapp.com",
  projectId: "aljamiyahapp",
  storageBucket: "aljamiyahapp.firebasestorage.app",
  messagingSenderId: "508199870007",
  appId: "1:508199870007:web:5aeee0d4bdbb4a4893e9b2"
};
const EMAILJS_PUBLIC_KEY = "o2fIFJJYtmnzK2XKg";
const EMAILJS_SERVICE_ID = "service_5dxkih9";
const EMAILJS_TEMPLATE_ID = "template_mr4lkca";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
// ذاكرة محلية: عند إعادة فتح التطبيق تُحتسب التغييرات فقط بدل إعادة قراءة كل المستندات.
// ضعها false إن كان الجهاز مشتركاً بين عدة أشخاص.
const OFFLINE_CACHE = true;
if (OFFLINE_CACHE) db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
const OWNER_EMAIL = "mamydady87@gmail.com"; // بريد المالك: لا توجد كلمة مرور هنا، الهوية تُتحقق من Firebase
const FV = firebase.firestore.FieldValue;
emailjs.init(EMAILJS_PUBLIC_KEY);

const BANKS = ["مصرف الراجحي","البنك الأهلي السعودي","بنك الإنماء","بنك الرياض","بنك البلاد","بنك الجزيرة","السعودي الفرنسي","البنك العربي الوطني","البنك السعودي الأول","بنك رقمي / أخرى","كاش (نقداً)"];

/* ============ الحالة ============ */
const state = {
  user: null, profile: null, isAdmin: false, view: 'loading', authMode: 'login',
  jamiyat: [], invites: [], activeId: null, j: null, members: {}, payments: [], jInvites: [],
  admin: { jamiyat: [], users: [] }, unsubs: [], jUnsubs: [], pays: {}, payLs: {}, afterOpen: null
};

/* ============ أدوات ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lc = s => String(s || '').trim().toLowerCase();
const money = n => Number(n || 0).toLocaleString('ar-SA') + ' ريال';
const bankOpts = sel => BANKS.map(b => `<option ${b === sel ? 'selected' : ''}>${b}</option>`).join('');
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const fixIban = s => String(s || '').replace(/\s+/g, '').toUpperCase();
const validIban = s => /^SA\d{22}$/.test(fixIban(s));
/* الاسم/الكنية وخصوصية الجوال والبريد */
const dispName = m => (m && ((m.showAs === 'nick' && m.nick) ? m.nick : m.name)) || '—';
const canSeeField = (m, key) => {
  const me = state.user && state.user.uid; if (!m) return false;
  if (m.uid === me) return true;
  if (state.j && state.j.creatorUid === me) return true; // المشرف يرى كل البيانات
  return key === 'phone' ? !!m.showPhone : !!m.showEmail;
};
const memberDoc = (uid, p) => ({ uid, name: p.name, email: lc(state.user.email), phone: p.phone, bank: p.bank, iban: p.iban, waOptIn: p.waOptIn !== false,
  nick: p.nick || '', showAs: (p.showAs === 'nick' && p.nick) ? 'nick' : 'name', showPhone: !!p.showPhone, showEmail: !!p.showEmail });
const readIdentity = f => ({ nick: f.nick.value.trim(), showAs: f.showAs.value === 'nick' ? 'nick' : 'name', showPhone: f.showPhone.checked, showEmail: f.showEmail.checked });
const identityErr = i => i.nick.length > 30 ? 'الكنية طويلة (30 حرفاً كحد أقصى)' : (i.showAs === 'nick' && !i.nick) ? 'اكتب الكنية أو اختر إظهار الاسم' : '';
/* رموز الجمعية */
const ICONS = ['🏠','💰','🎯','🌙','⭐','🌴','🕌','🤝','💎','🌹','🚗','✈️','🎓','🎁','🌿','🔥'];
const cleanIcon = s => Array.from(String(s || '').trim()).slice(0, 4).join('');
const iconHtml = j => j && j.icon ? esc(j.icon) : '<i class="fa-solid fa-people-roof"></i>';
const iconPicker = sel => `<div><label class="text-xs font-semibold block mb-1">رمز الجمعية (اختر من القائمة أو اكتب رمزك بنفسك)</label>
  <div class="flex flex-wrap gap-1.5 mb-2">${ICONS.map(i => `<button type="button" class="emo ${i === sel ? 'on' : ''}" data-act="pick-icon" data-v="${i}">${i}</button>`).join('')}<button type="button" class="emo ${sel ? '' : 'on'}" data-act="pick-icon" data-v="" aria-label="بدون رمز"><i class="fa-solid fa-people-roof text-sm"></i></button></div>
  <input name="icon" class="inp" maxlength="8" value="${esc(sel || '')}" placeholder="مثال: 🏠 أو أي رمز تكتبه"></div>`;
function updPreview(fm) {
  const pv = fm.querySelector('[data-preview]'); if (!pv || !fm.nick || !fm.showAs) return;
  const nm = ((fm.name && fm.name.value) || (state.user && state.user.displayName) || '').trim(), nk = fm.nick.value.trim();
  pv.textContent = 'سيظهر اسمك لبقية الأعضاء هكذا: ' + ((fm.showAs.value === 'nick' && nk) ? nk : (nm || '—'));

const normPhone = s => {

/* ============ منطق الجمعية ============ */
// أنواع الدورات: الشهرية على أساس الأشهر الميلادية، والبقية على أساس عدد ثابت من الأيام
const FREQS = {
  monthly:  { label: 'شهرية',        every: 'شهرياً',        days: 0,  unit: 'شهر' },
  tenday:   { label: 'كل 10 أيام',   every: 'كل 10 أيام',    days: 10, unit: 'دورة' },
  biweekly: { label: 'كل أسبوعين',   every: 'كل أسبوعين',    days: 14, unit: 'دورة' },
  weekly:   { label: 'أسبوعية',      every: 'أسبوعياً',      days: 7,  unit: 'أسبوع' }
};
const freqOf = j => FREQS[j && j.frequency] || FREQS.monthly;
const maxDayOf = j => freqOf(j).days || 31;
const DAY_MS = 86400000;
function monthIdx(j) { // رقم الدورة الحالية (سالب = لم تبدأ)
  const f = freqOf(j), s = new Date(j.startDate + 'T00:00:00'), n = new Date();
  if (!f.days) return (n.getFullYear() - s.getFullYear()) * 12 + n.getMonth() - s.getMonth();
  const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.floor(Math.round((today - s) / DAY_MS) / f.days);
}
function periodStart(j, idx) {
  const f = freqOf(j), s = new Date(j.startDate + 'T00:00:00');
  if (!f.days) return new Date(s.getFullYear(), s.getMonth() + idx, 1);
  return new Date(s.getFullYear(), s.getMonth(), s.getDate() + idx * f.days);
}
// يوم محدد داخل الدورة: للشهرية رقم اليوم من الشهر، ولغيرها رقم اليوم منذ بداية الدورة (1 = أول يوم)
function dayIn(j, idx, day) {
  const f = freqOf(j), first = periodStart(j, idx);
  if (!f.days) {
    const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    return new Date(first.getFullYear(), first.getMonth(), Math.min(day, last));
  }
  return new Date(first.getFullYear(), first.getMonth(), first.getDate() + Math.min(day, f.days) - 1);
}
function periodLabel(j, idx) {
  const f = freqOf(j);
  if (!f.days) return fmtMonth(periodStart(j, idx));
  const a = periodStart(j, idx), b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + f.days - 1);
  const o = { day: 'numeric', month: 'long' };
  return `${a.toLocaleDateString('ar-SA-u-ca-gregory', o)} – ${b.toLocaleDateString('ar-SA-u-ca-gregory', o)}`;
}
const r2 = n => Math.round(n * 100) / 100;
const fmtNum = n => Number(r2(n)).toLocaleString('ar-SA', { maximumFractionDigits: 2 });

// حساب العضو التراكمي: كل ما دفعه يُقسَّم على قيمة القسط الحالية.
// المستحق = (عدد الدورات حتى الآن ما عدا دور استلامه) × القسط. الزائد رصيد مقدّم يغطي الدفعات القادمة.
function accountFor(j, turns, cur, started, payments, uid, amount = j.amount) {
  const ownIdx = turns.indexOf(uid);
  let n = 0; if (started) for (let k = 0; k <= cur; k++) if (k !== ownIdx) n++;
  const owed = r2(n * amount);
  let confirmed = 0, pending = 0;
  payments.forEach(p => { if (p.uid !== uid) return; if (p.status === 'confirmed') confirmed += Number(p.amount) || 0; else pending += Number(p.amount) || 0; });
  confirmed = r2(confirmed); pending = r2(pending);
  const paid = r2(confirmed + pending), eps = 0.005;
  const remaining = r2(Math.max(0, owed - paid));
  const credit = r2(Math.max(0, paid - owed));
  let status = 'wait';
  if (started) status = confirmed >= owed - eps ? 'confirmed' : paid >= owed - eps ? 'pending' : paid > 0 ? 'partial' : 'unpaid';
  return { n, owed, confirmed, pending, paid, remaining, credit, status, covers: amount > 0 ? r2(paid / amount) : 0, mine: payments.filter(p => p.uid === uid) };
}
function ctx() {
  const j = state.j; if (!j) return null;
  const idx = monthIdx(j);
  const cur = Math.min(Math.max(idx, 0), j.count - 1);
  const turns = j.turns || [];
  const recUid = turns[cur] || null;
  const rec = recUid ? state.members[recUid] : null;
  const started = idx >= 0, finished = idx >= j.count;
  const acct = {}; turns.forEach(u => { acct[u] = accountFor(j, turns, cur, started, state.payments, u); });
  const curPays = state.payments.filter(p => p.month === cur);
  return { j, idx, cur, finished, started, turns, recUid, rec, pays: state.payments, curPays, acct,
           isCreator: j.creatorUid === state.user.uid, isRec: recUid === state.user.uid,
           me: acct[state.user.uid] || null, f: freqOf(j) };
}
function payStatus(c, uid) {
  if (uid === c.recUid) return 'recipient';
  return c.acct[uid] ? c.acct[uid].status : 'unpaid';
}

/* حجز رقم الجوال: مستند في phones/{الرقم} يحمل uid صاحبه، فلا يمكن لحسابين استخدام نفس الرقم */
async function saveProfileWithPhone(uid, data, mode, oldPhone) {
  const phoneRef = db.collection('phones').doc(data.phone), userRef = db.collection('users').doc(uid);
  await db.runTransaction(async t => {
    const ps = await t.get(phoneRef);
    if (ps.exists && ps.data().uid !== uid) throw new Error('PHONE_TAKEN');
    if (oldPhone && oldPhone !== data.phone) t.delete(db.collection('phones').doc(oldPhone));
    t.set(phoneRef, { uid });
    if (mode === 'update') t.update(userRef, data); else t.set(userRef, data);
  });
}
async function claimPhone(uid, phone) { // للحسابات القديمة: يحجز رقمها بصمت إن لم يكن محجوزاً
  try { if (!validPhone(phone)) return; const r = db.collection('phones').doc(phone); const x = await r.get(); if (!x.exists) await r.set({ uid }); } catch (e) {}
}
const PHONE_TAKEN_MSG = 'رقم الجوال هذا مسجّل مسبقاً بحساب آخر';
const phoneSaveErr = e => e && e.message === 'PHONE_TAKEN' ? PHONE_TAKEN_MSG : (e && e.code === 'permission-denied' ? 'تعذر حجز رقم الجوال: انشر قواعد Firestore الجديدة (مجموعة phones) ثم أعد المحاولة' : (e && e.message) || 'خطأ غير معروف');

function cleanup(arr) { arr.forEach(u => u()); arr.length = 0; }

function startListeners() {
  const uid = state.user.uid, email = lc(state.user.email), phone = normPhone(state.profile && state.profile.phone);
  let invA = [], invB = [];
  const merge = () => { const m = new Map(); [...invA, ...invB].forEach(i => m.set(i.id, i)); state.invites = [...m.values()]; if (state.view === 'home') render(); };
  state.unsubs.push(
    db.collection('jamiyat').where('memberUids', 'array-contains', uid).onSnapshot(s => {
      state.jamiyat = s.docs.map(d => ({ id: d.id, ...d.data() }));
      syncPayListeners();
      if (['home'].includes(state.view)) render();
    }, e => toast('خطأ في تحميل الجمعيات: ' + e.message, 'error')),
    db.collection('invites').where('email', '==', email).where('status', '==', 'pending').onSnapshot(s => {
      invA = s.docs.map(d => ({ id: d.id, ...d.data() })); merge();
    }, e => toast('خطأ في تحميل الدعوات: ' + e.message, 'error'))
  );
  if (validPhone(phone)) state.unsubs.push(
    db.collection('invites').where('phone', '==', phone).where('status', '==', 'pending').onSnapshot(s => {
      invB = s.docs.map(d => ({ id: d.id, ...d.data() })); merge();
    }, e => toast('تعذر تحميل دعوات الجوال: تحقق من قواعد Firestore (' + e.code + ')', 'error'))
  );
}

async function doRegister(f) {
  const name = f.name.value.trim(), email = lc(f.email.value), pass = f.password.value;
  const phone = normPhone(f.phone.value), bank = resolveBank(f), iban = fixIban(f.iban.value);
  if (bank === null) return;
  const idn = readIdentity(f), ie = identityErr(idn); if (ie) return toast(ie, 'error');
  if (name.length < 3) return toast('اكتب الاسم الثلاثي', 'error');
  if (!validEmail(email)) return toast('البريد غير صحيح', 'error');
  if (pass.length < 6) return toast('كلمة المرور 6 أحرف على الأقل', 'error');
  if (!validPhone(phone)) return toast('رقم الجوال يجب أن يبدأ بـ 05 ويتكون من 10 أرقام', 'error');
  if (!bank.startsWith('كاش') && !validIban(iban)) return toast('الآيبان يجب أن يكون SA متبوعاً بـ 22 رقماً', 'error');
  if (!f.terms.checked) return toast('يجب الموافقة على الشروط', 'error');
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    try {
      await cred.user.updateProfile({ displayName: name });
      await saveProfileWithPhone(cred.user.uid, { name, email, phone, bank, iban: bank.startsWith('كاش') ? '' : iban, waOptIn: f.waOptIn.checked, ...idn, avatar: '', createdAt: FV.serverTimestamp() }, 'set', null);
    } catch (e) {
      await cred.user.delete().catch(() => {}); // نتراجع عن إنشاء الحساب ليعيد المحاولة برقم آخر
      return toast(phoneSaveErr(e), 'error');
    }
    await cred.user.sendEmailVerification({ url: appUrl() });
    toast('تم إنشاء الحساب وإرسال رابط التحقق إلى بريدك');
    await auth.signOut().catch(() => {});
    state.authMode = 'login'; state.view = 'auth'; render();
    toast('فعّل بريدك من الرسالة ثم سجّل الدخول', 'info');
  } catch (e) { toast(authErr(e), 'error'); }
}

// مشرف الجمعية يقرأ كل دفعاتها، والعضو يقرأ دفعاته فقط (أقل استهلاكاً للحصة المجانية)
function syncPayListeners() {
  if (!state.user) return;
  const uid = state.user.uid, want = new Set();
  // فقط الجمعيات الجارية (بدأت ولم تنتهِ) وغير المفتوحة الآن (المفتوحة لها مستمع خاص بها)
  state.jamiyat.forEach(j => {

  });
  Object.keys(state.payLs).forEach(id => { if (!want.has(id)) { state.payLs[id](); delete state.payLs[id]; } });
  state.jamiyat.forEach(j => {
    if (!want.has(j.id) || state.payLs[j.id]) return;
    const col = db.collection('jamiyat').doc(j.id).collection('payments');

function homeAlerts() {
  const uid = state.user.uid, out = [], today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = d => Math.round((d - today) / DAY_MS), SOON = 5;
  const when = n => n < 0 ? `متأخر ${-n} ${-n === 1 ? 'يوم' : 'أيام'}` : n === 0 ? 'آخر موعد اليوم' : n === 1 ? 'آخر موعد غداً' : `آخر موعد بعد ${n} أيام`;
  state.jamiyat.forEach(j => {
    const pays = state.pays[j.id]; if (!pays || !j.startDate) return;
    const idx = monthIdx(j); if (idx < 0 || idx >= j.count) return;
    const cur = idx, turns = j.turns || [], recUid = turns[cur];
    const due = dayIn(j, cur, j.lastDay), left = diff(due), payoutLeft = diff(dayIn(j, cur, j.payDay));
    const owes = u => u !== recUid && ['unpaid', 'partial'].includes(accountFor(j, turns, cur, true, pays, u).status);
    // 1) قسطي أنا
    if (turns.includes(uid) && owes(uid)) {
      const mine = accountFor(j, turns, cur, true, pays, uid);
      const prev = cur > 0 ? accountFor(j, turns, cur - 1, true, pays, uid) : null;
      const late = (prev && ['unpaid', 'partial'].includes(prev.status)) || left < 0;
      if (late || left <= SOON) out.push({ lvl: late ? 0 : 1, id: j.id, title: `قسط جمعية «${j.name}»`,
        text: `المتبقي عليك ${fmtNum(mine.remaining)} ريال — ${late ? 'متأخر، سدّد في أقرب وقت' : when(left)} (${fmtDate(due)})` });
    }
    // 2) المشرف: أعضاء لم يسددوا
    if (j.creatorUid === uid && (left <= SOON)) {
      const n = turns.filter(u => u !== uid && owes(u)).length;
      if (n > 0) out.push({ lvl: left < 0 ? 0 : 1, id: j.id, remind: true, title: `جمعية «${j.name}»`,
        text: `${n} ${n === 1 ? 'عضو لم يسدد' : 'أعضاء لم يسددوا'} بعد — ${when(left)} (${fmtDate(due)})` });
    }
    // 3) دوري في القبض قريباً
    if (recUid === uid && payoutLeft >= 0 && payoutLeft <= 7)
      out.push({ lvl: 2, id: j.id, title: `دورك في القبض 🎉`, text: `جمعية «${j.name}» — ${payoutLeft === 0 ? 'اليوم' : payoutLeft === 1 ? 'غداً' : `بعد ${payoutLeft} أيام`} (${fmtDate(dayIn(j, cur, j.payDay))})` });
  });
  return out.sort((a, b) => a.lvl - b.lvl);
}

// ملف تقويم (.ics): مواعيد السداد ويوم القبض لعضو محدد، مع تنبيه قبلها بيوم وصباح اليوم نفسه
const icsEsc = t => String(t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const icsDate = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
function icsFold(line) {
  const enc = new TextEncoder(); let out = '', cur = '', bytes = 0, first = true;
  for (const ch of line) {
    const b = enc.encode(ch).length;
    if (bytes + b > (first ? 74 : 73)) { out += cur + '\r\n '; cur = ''; bytes = 0; first = false; }
    cur += ch; bytes += b;
  }
  return out + cur;
}
function buildIcs(j, uid) {
  const turns = j.turns || [], my = turns.indexOf(uid); if (my < 0) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const ev = [];
  const add = (k, kind, day, title, desc) => {
    if (day < today) return;
    const end = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1);
    const alarm = trig => ['BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(title)}`, `TRIGGER:${trig}`, 'END:VALARM'];
    ev.push(...['BEGIN:VEVENT', `UID:${j.id}-${k}-${kind}@jamiya`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${icsDate(day)}`, `DTEND;VALUE=DATE:${icsDate(end)}`,
      `SUMMARY:${icsEsc(title)}`, `DESCRIPTION:${icsEsc(desc)}`, 'TRANSP:TRANSPARENT', ...alarm('-PT15H'), ...alarm('PT8H'), 'END:VEVENT']);
  };
  for (let k = 0; k < j.count; k++) {
    if (k === my) add(k, 'recv', dayIn(j, k, j.payDay), `يوم قبضك في جمعية «${j.name}»`, `دورك في القبض — ${periodLabel(j, k)}`);
    else add(k, 'pay', dayIn(j, k, j.lastDay), `آخر موعد لسداد قسط «${j.name}»`, `القسط ${j.amount} ريال — ${periodLabel(j, k)}`);
  }
  if (!ev.length) return null;
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Jamiya//AR//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', `X-WR-CALNAME:${icsEsc('جمعية ' + j.name)}`, ...ev, 'END:VCALENDAR']
    .map(icsFold).join('\r\n') + '\r\n';
}
function addToCalendar() {
  const c = ctx(); if (!c) return;
  const ics = buildIcs(c.j, state.user.uid);
  if (!ics) return toast('لا توجد مواعيد قادمة لإضافتها', 'info');
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = `jamiya-${c.j.id}.ics`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('تم تجهيز ملف التقويم، افتحه لإضافة المواعيد. إن تغيّر ترتيب القبض أعد التصدير (لن تتكرر المواعيد)', 'info');
}

/* ============ تصدير كشف الجمعية (Excel / PDF) ============ */
function statementData() {
  const c = ctx(); if (!c) return null;
  const j = c.j, st = { recipient: 'المستلم', confirmed: 'تم السداد', pending: 'بانتظار التأكيد', partial: 'سداد جزئي', unpaid: 'لم يسدد', wait: 'لم تبدأ' };
  const nameOf = u => dispName(state.members[u]);
  const summary = c.turns.map((u, i) => { const a = c.acct[u] || {};
    return { order: i + 1, name: nameOf(u), turn: periodLabel(j, i), owed: a.owed || 0, confirmed: a.confirmed || 0, pending: a.pending || 0, remaining: a.remaining || 0, credit: a.credit || 0, status: st[payStatus(c, u)] || '' }; });
  const toD = p => { const t = p.createdAt && p.createdAt.toDate ? p.createdAt.toDate() : null; return t; };
  const pays = [...state.payments].sort((a, b) => (a.month - b.month) || String(a.id).localeCompare(String(b.id)))
    .map(p => ({ name: state.members[p.uid] ? nameOf(p.uid) : (p.name || '—'), cycle: periodLabel(j, p.month), amount: Number(p.amount) || 0, status: p.status === 'confirmed' ? 'مؤكدة' : 'بانتظار التأكيد', ref: p.ref || '', date: toD(p) }));
  const sum = k => r2(summary.reduce((t, r) => t + r[k], 0));
  return { c, j, summary, pays, totals: { owed: sum('owed'), confirmed: sum('confirmed'), pending: sum('pending'), remaining: sum('remaining') },
    cycle: c.finished ? 'اكتملت الجمعية' : !c.started ? 'لم تبدأ بعد' : `الدورة الحالية: ${periodLabel(j, c.cur)} — المستلم: ${c.rec ? dispName(c.rec) : '—'}` };
}
const csvCell = v => { let t = String(v ?? ''); if (/^[=+\-@\t\r]/.test(t) && isNaN(Number(t))) t = "'" + t; return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
const isoDay = d => d ? d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') : '';
function buildStatementCsv(d) {
  const j = d.j, rows = [
    ['كشف جمعية', j.name], ['التكرار', freqOf(j).label], ['القسط (ريال)', j.amount], ['عدد الأعضاء', j.count], ['تاريخ الكشف', isoDay(new Date())], [d.cycle], [],
    ['ملخص الأعضاء'], ['الترتيب', 'الاسم', 'دورة القبض', 'المستحق', 'المؤكد', 'بانتظار التأكيد', 'المتبقي', 'رصيد مقدّم', 'الحالة'],
    ...d.summary.map(r => [r.order, r.name, r.turn, r.owed, r.confirmed, r.pending, r.remaining, r.credit, r.status]),
    ['الإجمالي', '', '', d.totals.owed, d.totals.confirmed, d.totals.pending, d.totals.remaining, '', ''], [],
    ['الدفعات'], ['العضو', 'الدورة', 'المبلغ', 'الحالة', 'المرجع', 'التاريخ'],
    ...d.pays.map(p => [p.name, p.cycle, p.amount, p.status, p.ref, isoDay(p.date)])
  ];
  return '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
}
function downloadFile(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));

  const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'جارٍ المعالجة...';
  try {

    const batch = db.batch();

// ضغط الصورة في المتصفح: أقصى بُعد 1000px وجودة JPEG متدرجة حتى يقل الحجم عن ~600KB
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let scale = Math.min(1, 1000 / Math.max(img.width, img.height));
      for (let attempt = 0; attempt < 6; attempt++) {
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
        const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
        const limit = attempt < 2 ? 220000 : 600000; // الهدف إيصال أقل من ~220KB، ثم نتساهل إن لزم
        for (const q of [0.72, 0.58, 0.45]) {
          const out = cv.toDataURL('image/jpeg', q);
          if (out.length < limit) return resolve(out);
        }
        scale *= 0.75;
      }
      reject(new Error('تعذر تصغير الصورة بما يكفي، جرّب صورة أخرى'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('تعذر قراءة الصورة')); };
    img.src = url;
  });
}

    <p class="text-[11px] text-slate-500">حرّك الأعضاء بالأسهم. الدورات المنتهية أو التي بدأ فيها السداد مقفلة لحماية سجل المدفوعات.</p>

function orderMove(i, dlt) {
  const c = ctx(), d = state.orderDraft, k = i + dlt;
  if (i < lockedCount(c) || k < lockedCount(c) || k >= d.length) return;
  [d[i], d[k]] = [d[k], d[i]]; showOrderModal();
}
function orderShuffle() {
  const c = ctx(), d = state.orderDraft, lock = lockedCount(c);
  const free = d.slice(lock);
  for (let i = free.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [free[i], free[k]] = [free[k], free[i]]; }
  state.orderDraft = d.slice(0, lock).concat(free); showOrderModal();
}

/* ============ تطبيق PWA: التثبيت والتحديث ============ */
let deferredPrompt = null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || (window.matchMedia && matchMedia('(display-mode: minimal-ui)').matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const ibKey = 'jm_ib_dismiss';
function ibDismissed() { try { return Date.now() - Number(localStorage.getItem(ibKey) || 0) < 3 * 86400000; } catch (e) { return false; } }
function launchAction() {
  try { const a = new URLSearchParams(location.search).get('action'); if (a) history.replaceState(null, '', location.pathname); return a === 'create' ? 'create' : null; } catch (e) { return null; }
}
function renderBanner() {
  const el = $('banner');
  const bar = (icon, title, text, btn, closable = true) => `<div class="ibar fade"><img src="icon-192.png" alt=""><div class="flex-1 min-w-0"><p class="text-sm font-black">${title}</p><p class="text-[11px] text-slate-300 leading-snug">${text}</p></div>${btn}${closable ? '<button class="x" data-act="dismiss-ib" aria-label="إخفاء"><i class="fa-solid fa-xmark"></i></button>' : ''}</div>`;
  let h = '';
  if (state.updateReady) h = bar('', 'يتوفر تحديث جديد', 'أعد تحميل التطبيق للحصول على آخر التحسينات', '<button class="btn b-pri" data-act="reload-app">تحديث</button>', false);
  else if (!isStandalone() && !ibDismissed()) {
    if (state.appInstalled) h = bar('', 'التطبيق مثبّت لديك', 'افتحه من الشاشة الرئيسية لتجربة أسرع', '');
    else if (deferredPrompt) h = bar('', 'ثبّت التطبيق', 'أضفه لشاشتك الرئيسية ليعمل كتطبيق كامل', '<button class="btn b-pri" data-act="install-app">تثبيت</button>');
    else if (isIOS()) h = bar('', 'أضف التطبيق للشاشة الرئيسية', 'من زر المشاركة في سفاري', '<button class="btn b-pri" data-act="install-app">كيف؟</button>');
  }
  el.innerHTML = h;
}
async function installApp() {
  if (deferredPrompt) {
    const p = deferredPrompt; deferredPrompt = null; p.prompt();
    try { await p.userChoice; } catch (e) {}
    renderBanner(); renderNav(); return;
  }
  const note = '<div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-[11px] text-emerald-900 leading-relaxed">بعد التثبيت افتح التطبيق من الشاشة الرئيسية، وستجد دعواتك وجمعياتك تلقائياً عند الدخول بنفس بريدك.</div>';
  if (isIOS()) {
    const notSafari = /crios|fxios|edgios/i.test(navigator.userAgent);
    return showModal('تثبيت على الآيفون', `<div class="space-y-3 text-xs leading-relaxed">${notSafari ? '<div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-900">للحصول على أفضل نتيجة افتح الرابط في متصفح Safari.</div>' : ''}
      <ol class="space-y-2.5">
        <li class="flex gap-3 items-center"><span class="jicon !w-9 !h-9 !text-sm">1</span><span>اضغط زر المشاركة <i class="fa-solid fa-arrow-up-from-bracket text-sky-600"></i> أسفل الشاشة.</span></li>
        <li class="flex gap-3 items-center"><span class="jicon !w-9 !h-9 !text-sm">2</span><span>مرّر للأسفل واختر <b>إضافة إلى الشاشة الرئيسية</b> <i class="fa-regular fa-square-plus"></i>.</span></li>
        <li class="flex gap-3 items-center"><span class="jicon !w-9 !h-9 !text-sm">3</span><span>اضغط <b>إضافة</b>، وستظهر أيقونة التطبيق في شاشتك.</span></li></ol>
      ${note}<p class="text-[11px] text-slate-500">ملاحظة: نظام آيفون لا يفتح الروابط المشاركة داخل التطبيق تلقائياً، افتح التطبيق من أيقونته.</p></div>`);
  }
  showModal('تثبيت التطبيق', `<div class="space-y-3 text-xs leading-relaxed"><ol class="space-y-2.5">
      <li class="flex gap-3 items-center"><span class="jicon !w-9 !h-9 !text-sm">1</span><span>افتح قائمة المتصفح <i class="fa-solid fa-ellipsis-vertical"></i> في الأعلى.</span></li>
      <li class="flex gap-3 items-center"><span class="jicon !w-9 !h-9 !text-sm">2</span><span>اختر <b>تثبيت التطبيق</b> أو <b>إضافة إلى الشاشة الرئيسية</b>.</span></li></ol>${note}</div>`);
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; renderBanner(); renderNav(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast('تم تثبيت التطبيق، افتحه من الشاشة الرئيسية'); renderBanner(); renderNav(); });
if (isStandalone()) document.body.classList.add('standalone');
if (navigator.getInstalledRelatedApps && !isStandalone()) navigator.getInstalledRelatedApps().then(a => { state.appInstalled = a.length > 0; renderBanner(); }).catch(() => {});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) { state.updateReady = true; renderBanner(); } }); });
  }).catch(() => {}));
}
document.addEventListener('click', e => { if (e.target.matches && e.target.matches('[data-bg]')) closeModal(); });
renderBanner();

  'go-home': () => { cleanup(state.jUnsubs); state.view = state.user && state.profile ? 'home' : state.view; render(); },

  'go-profile': () => { state.view = 'profile'; render(); },

  'google': doGoogle,
  'auth-register': () => { state.authMode = 'register'; render(); },
  'auth-login': () => { state.authMode = 'login'; render(); },
  'auth-reset': () => { state.authMode = 'reset'; render(); },
  'recheck': recheckVerification,
  'resend-verify': () => auth.currentUser.sendEmailVerification({ url: appUrl() }).then(() => toast('أُعيد إرسال رابط التحقق')).catch(e => toast(authErr(e), 'error')),
  'open': (el) => openJamiya(el.dataset.id),
  'accept': (el) => acceptInvite(el.dataset.id),
  'decline': (el) => declineInvite(el.dataset.id),
  'delete-modal': openDeleteModal, 'invite-modal': () => openModal('invite'), 'pay-modal': () => openModal('pay'), 'mod-modal': () => openModal('mod'), 'edit-modal': () => openModal('edit'),
  'close': closeModal,
  'confirm-pay': (el) => confirmPayment(el.dataset.id),
  'member-pays': (el) => openMemberPays(el.dataset.uid),
  'confirm-edit': () => state.pendingEdit && saveEdit(state.pendingEdit),
  'remind': remindUnpaid,
  'resend': (el) => { const i = state.jInvites.find(x => x.id === el.dataset.id); if (i) showInviteShare({ ...i, amount: state.j.amount }); },
  'mail-invite': () => sendInviteMail(state.lastInvite),
  'add-cal': addToCalendar,
  'export-modal': openExportModal,
  'export-csv': exportCsv,
  'export-print': exportPrint,
  'alert-remind': (el) => { state.afterOpen = { id: el.dataset.id, act: 'wa-remind' }; openJamiya(el.dataset.id); },
  'cancel-inv': (el) => db.collection('invites').doc(el.dataset.id).delete().then(() => toast('أُلغيت الدعوة', 'info')).catch(e => toast(e.message, 'error')),
  'order-modal': openOrderModal,
  'wa-remind': openWaReminders, 'share-app': shareApp,
  'copy-share': () => navigator.clipboard.writeText(state.shareText).then(() => toast('تم نسخ الرابط')).catch(() => toast('تعذر النسخ', 'error')),
  'od-up': (el) => orderMove(+el.dataset.i, -1), 'od-down': (el) => orderMove(+el.dataset.i, 1),
  'od-shuffle': orderShuffle, 'od-save': orderSave,
  'view-proof': (el) => viewProof(el.dataset.id),
  'refresh-admin': loadAdmin, 'test-mail': testMail,
  'copy-invite': () => navigator.clipboard.writeText(inviteText(state.lastInvite)).then(() => toast('تم نسخ نص الدعوة')).catch(() => toast('تعذر النسخ', 'error')),
  'install-app': installApp, 'reload-app': () => location.reload(),
  'dismiss-ib': () => { try { localStorage.setItem(ibKey, Date.now()); } catch (e) {} state.updateReady = false; renderBanner(); },
  'pick-icon': (el) => { const fm = el.closest('form'); if (!fm) return; fm.icon.value = el.dataset.v; fm.querySelectorAll('.emo').forEach(b => b.classList.toggle('on', b === el)); },
  'vote-yes': () => voteMod(true), 'vote-no': () => voteMod(false), 'close-mod': closeMod
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (fn) fn(el);
});
document.addEventListener('change', e => {
  if (e.target.matches && e.target.matches('select[data-freq]') && e.target.form) {
    const dl = dayLabels(e.target.value), fm = e.target.form;
    const l1 = fm.querySelector('[data-lbl-last]'), l2 = fm.querySelector('[data-lbl-pay]');
    if (l1) l1.textContent = dl.last; if (l2) l2.textContent = dl.pay;
    ['lastDay', 'payDay'].forEach(n => { if (fm[n]) fm[n].max = dl.max; });
  }
  if (e.target.name === 'bank' && e.target.form) {
    const box = e.target.form.querySelector('[data-other]');
    if (box) box.classList.toggle('hide', e.target.value !== OTHER_BANK);
  }
});
document.addEventListener('input', e => {
  const fm = e.target.form; if (!fm) return;
  if (fm.querySelector('[data-identity]')) updPreview(fm);
  if (e.target.name === 'icon') fm.querySelectorAll('.emo').forEach(b => b.classList.toggle('on', b.dataset.v === e.target.value.trim()));
});
const forms = { 'f-register': doRegister, 'f-login': doLogin, 'f-reset': doReset, 'f-complete': doCompleteProfile, 'f-create': handleCreate,
  'f-invite': handleInvite, 'f-pay': submitPayment, 'f-mod': submitMod, 'f-edit': submitEdit, 'f-profile': saveProfile, 'f-delete': submitDelete };
document.addEventListener('submit', e => { const fn = forms[e.target.id]; if (fn) { e.preventDefault(); fn(e.target); } });

render();
</script>
<div id="print-root"></div>
</body>
</html>
