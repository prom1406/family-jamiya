}

// أنواع الدورات: الشهرية على أساس الأشهر الميلادية، والبقية على أساس عدد ثابت من الأيام
const FREQS = {
  monthly:  { label: 'شهرية',        every: 'شهرياً',        days: 0,  unit: 'شهر' },
  tenday:   { label: 'كل 10 أيام',   every: 'كل 10 أيام',    days: 10, unit: 'دورة' },
  biweekly: { label: 'كل أسبوعين',   every: 'كل أسبوعين',    days: 14, unit: 'دورة' },
  weekly:   { label: 'أسبوعية',      every: 'أسبوعياً',      days: 7,  unit: 'أسبوع' }

const freqOf = j => FREQS[j && j.frequency] || FREQS.monthly;

const DAY_MS = 86400000;
function monthIdx(j) { // رقم الدورة الحالية (سالب = لم تبدأ)

}
function periodStart(j, idx) {

  return new Date(s.getFullYear(), s.getMonth(), s.getDate() + idx * f.days);
}
// يوم محدد داخل الدورة: للشهرية رقم اليوم من الشهر، ولغيرها رقم اليوم منذ بداية الدورة (1 = أول يوم)

/* حجز رقم الجوال: مستند في phones/{الرقم} يحمل uid صاحبه، فلا يمكن لحسابين استخدام نفس الرقم */
async function saveProfileWithPhone(uid, data, mode, oldPhone) {
  const phoneRef = db.collection('phones').doc(data.phone), userRef = db.collection('users').doc(uid);
  await db.runTransaction(async t => {
    const ps = await t.get(phoneRef);
    if (ps.exists && ps.data().uid !== uid) throw new Error('PHONE_TAKEN');
    if (oldPhone && oldPhone !== data.phone) t.delete(db.collection('phones').doc(oldPhone));
    t.set(phoneRef, { uid });
    if (mode === 'update') t.update(userRef, data); else t.set(userRef, data);
  });
}

function stopPayListeners() { Object.values(state.payLs).forEach(u => u()); state.payLs = {}; }

function syncPayListeners() {
  if (!state.user) return;
  const uid = state.user.uid, want = new Set();
  // فقط الجمعيات الجارية (بدأت ولم تنتهِ) وغير المفتوحة الآن (المفتوحة لها مستمع خاص بها)

  });
  Object.keys(state.payLs).forEach(id => { if (!want.has(id)) { state.payLs[id](); delete state.payLs[id]; } });
  state.jamiyat.forEach(j => {
    const staff = j.creatorUid === uid || (!!j.deputyUid && j.deputyUid === uid); state.payRole = state.payRole || {};
    if (state.payLs[j.id] && state.payRole[j.id] !== staff) { state.payLs[j.id](); delete state.payLs[j.id]; }
    if (!want.has(j.id) || state.payLs[j.id]) return;
    state.payRole[j.id] = staff;
    const col = db.collection('jamiyat').doc(j.id).collection('payments');
    const q = staff ? col : col.where('uid', '==', uid);
    state.payLs[j.id] = q.onSnapshot(s => {

function homeAlerts() {
  const uid = state.user.uid, out = [], today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = d => Math.round((d - today) / DAY_MS), SOON = 5;
  const when = n => n < 0 ? `متأخر ${-n} ${-n === 1 ? 'يوم' : 'أيام'}` : n === 0 ? 'آخر موعد اليوم' : n === 1 ? 'آخر موعد غداً' : `آخر موعد بعد ${n} أيام`;
  state.jamiyat.forEach(j => {
    const pays = state.pays[j.id]; if (!pays || !j.startDate) return;
    const idx = monthIdx(j); if (idx < 0 || idx >= j.count) return;
    const cur = idx, turns = j.turns || [], recUid = turns[cur];
    const due = dayIn(j, cur, j.lastDay), left = diff(due), payoutLeft = diff(dayIn(j, cur, j.payDay));
    const owes = u => (u !== recUid || sharesOf(turns, u) > 1) && ['unpaid', 'partial'].includes(accountFor(j, turns, cur, true, pays, u).status);
    // 1) قسطي أنا
    if (turns.includes(uid) && owes(uid)) {
      const mine = accountFor(j, turns, cur, true, pays, uid);
      const prev = cur > 0 ? accountFor(j, turns, cur - 1, true, pays, uid) : null;
      const late = (prev && ['unpaid', 'partial'].includes(prev.status)) || left < 0;
      if (late || left <= SOON) out.push({ lvl: late ? 0 : 1, id: j.id, title: `قسط جمعية «${j.name}»`,
        text: `المتبقي عليك ${fmtNum(mine.remaining)} ريال — ${late ? 'متأخر، سدّد في أقرب وقت' : when(left)} (${fmtDate(due)})` });
    }
    // 2) المشرف: أعضاء لم يسددوا
    if ((j.creatorUid === uid || (j.deputyUid && j.deputyUid === uid)) && (left <= SOON)) {
      const n = [...new Set(turns)].filter(u => u !== uid && owes(u)).length;
      if (n > 0) out.push({ lvl: left < 0 ? 0 : 1, id: j.id, remind: true, title: `جمعية «${j.name}»`,
        text: `${n} ${n === 1 ? 'عضو لم يسدد' : 'أعضاء لم يسددوا'} بعد — ${when(left)} (${fmtDate(due)})` });
    }
    // 3) دوري في القبض قريباً
    if (recUid === uid && payoutLeft >= 0 && payoutLeft <= 7)
      out.push({ lvl: 2, id: j.id, title: `دورك في القبض 🎉`, text: `جمعية «${j.name}» — ${payoutLeft === 0 ? 'اليوم' : payoutLeft === 1 ? 'غداً' : `بعد ${payoutLeft} أيام`} (${fmtDate(dayIn(j, cur, j.payDay))})` });
  });
  return out.sort((a, b) => a.lvl - b.lvl);
}

// ملف تقويم (.ics): مواعيد السداد ويوم القبض لعضو محدد، مع تنبيه قبلها بيوم وصباح اليوم نفسه
const icsEsc = t => String(t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const icsDate = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');

  const enc = new TextEncoder(); let out = '', cur = '', bytes = 0, first = true;
  for (const ch of line) {
    const b = enc.encode(ch).length;

    cur += ch; bytes += b;
  }
  return out + cur;
}
function buildIcs(j, uid) {

  const today = new Date(); today.setHours(0, 0, 0, 0);

  const ev = [];
  const add = (k, kind, day, title, desc) => {
    if (day < today) return;
    const end = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1);
    const alarm = trig => ['BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(title)}`, `TRIGGER:${trig}`, 'END:VALARM'];
    ev.push(...['BEGIN:VEVENT', `UID:${j.id}-${k}-${kind}@jamiya`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${icsDate(day)}`, `DTEND;VALUE=DATE:${icsDate(end)}`,
      `SUMMARY:${icsEsc(title)}`, `DESCRIPTION:${icsEsc(desc)}`, 'TRANSP:TRANSPARENT', ...alarm('-PT15H'), ...alarm('PT8H'), 'END:VEVENT']);
  };
  for (let k = 0; k < j.count; k++) {
    if (turns[k] === uid) add(k, 'recv', dayIn(j, k, j.payDay), `يوم قبضك في جمعية «${j.name}»`, `دورك في القبض — ${periodLabel(j, k)}`);

/* ============ تصدير كشف الجمعية (Excel / PDF) ============ */
function statementData() {
  const c = ctx(); if (!c) return null;
  const j = c.j, st = { recipient: 'المستلم', confirmed: 'تم السداد', pending: 'بانتظار التأكيد', partial: 'سداد جزئي', unpaid: 'لم يسدد', wait: 'لم تبدأ' };
  const nameOf = u => dispName(state.members[u]);
  const summary = c.turns.map((u, i) => { const first = c.turns.indexOf(u) === i, a = first ? (c.acct[u] || {}) : {};
    return { order: i + 1, name: nameOf(u) + (first ? '' : ' (سهم إضافي)'), turn: periodLabel(j, i), owed: a.owed || 0, confirmed: a.confirmed || 0, pending: a.pending || 0, remaining: a.remaining || 0, credit: a.credit || 0, status: first ? (st[payStatus(c, u)] || '') : '' }; });
  const toD = p => { const t = p.createdAt && p.createdAt.toDate ? p.createdAt.toDate() : null; return t; };
  const pays = [...state.payments].sort((a, b) => (a.month - b.month) || String(a.id).localeCompare(String(b.id)))
    .map(p => ({ name: state.members[p.uid] ? nameOf(p.uid) : (p.name || '—'), cycle: periodLabel(j, p.month), amount: Number(p.amount) || 0, status: p.status === 'confirmed' ? 'مؤكدة' : 'بانتظار التأكيد', ref: p.ref || '', date: toD(p) }));
  const sum = k => r2(summary.reduce((t, r) => t + r[k], 0));
  return { c, j, summary, pays, totals: { owed: sum('owed'), confirmed: sum('confirmed'), pending: sum('pending'), remaining: sum('remaining') },
    cycle: c.finished ? 'اكتملت الجمعية' : !c.started ? 'لم تبدأ بعد' : `الدورة الحالية: ${periodLabel(j, c.cur)} — المستلم: ${c.rec ? dispName(c.rec) : '—'}` };
}
const csvCell = v => { let t = String(v ?? ''); if (/^[=+\-@\t\r]/.test(t) && isNaN(Number(t))) t = "'" + t; return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
const isoDay = d => d ? d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') : '';
function buildStatementCsv(d) {
  const j = d.j, rows = [
    ['كشف جمعية', j.name], ['التكرار', freqOf(j).label], ['القسط (ريال)', j.amount], ['عدد الأعضاء', j.count], ['تاريخ الكشف', isoDay(new Date())], [d.cycle], [],
    ['ملخص الأعضاء'], ['الترتيب', 'الاسم', 'دورة القبض', 'المستحق', 'المؤكد', 'بانتظار التأكيد', 'المتبقي', 'رصيد مقدّم', 'الحالة'],
    ...d.summary.map(r => [r.order, r.name, r.turn, r.owed, r.confirmed, r.pending, r.remaining, r.credit, r.status]),
    ['الإجمالي', '', '', d.totals.owed, d.totals.confirmed, d.totals.pending, d.totals.remaining, '', ''], [],
    ['الدفعات'], ['العضو', 'الدورة', 'المبلغ', 'الحالة', 'المرجع', 'التاريخ'],
    ...d.pays.map(p => [p.name, p.cycle, p.amount, p.status, p.ref, isoDay(p.date)])

  return '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
}

// ضغط الصورة في المتصفح: أقصى بُعد 1000px وجودة JPEG متدرجة حتى يقل الحجم عن ~600KB
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let scale = Math.min(1, 900 / Math.max(img.width, img.height));
      for (let attempt = 0; attempt < 6; attempt++) {
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
        const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
        const limit = attempt < 2 ? 140000 : 350000; // الهدف إيصال أقل من ~220KB، ثم نتساهل إن لزم
        for (const q of [0.72, 0.58, 0.45]) {
          const out = cv.toDataURL('image/jpeg', q);
          if (out.length < limit) return resolve(out);
        }
        scale *= 0.75;
      }
      reject(new Error('تعذر تصغير الصورة بما يكفي، جرّب صورة أخرى'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('تعذر قراءة الصورة')); };
    img.src = url;
  });
}

/* ============ ترتيب الأدوار وتعديل الشروط ============ */
/* ===== تعديل ترتيب القبض (للمشرف) ===== */
function lockedCount(c) {
  if (c.finished) return c.turns.length;
  if (!c.started) return 0;
  return c.cur + (c.curPays.length > 0 ? 1 : 0); // الدورات الماضية، ودورة جارٍ فيها سداد، مقفلة
}
function openOrderModal() {
  const c = ctx(); if (!c || !c.isCreator) return;
  state.orderDraft = [...c.turns];
  showOrderModal();
}
function showOrderModal() {
  const c = ctx(), d = state.orderDraft, lock = lockedCount(c);
  const rows = d.map((u, i) => {
    const m = state.members[u] || { name: '...' }, locked = i < lock;
    return `<div class="flex items-center justify-between p-2.5 rounded-xl text-xs ${locked ? 'bg-slate-100 text-slate-400' : 'bg-slate-50 border border-slate-100'}">
      <div class="flex items-center gap-2"><span class="w-6 h-6 rounded-full ${locked ? 'bg-slate-200' : 'bg-emerald-100 text-emerald-800'} font-bold flex items-center justify-center">${i + 1}</span>
      <div><b>${esc(dispName(m))}</b><div class="text-[10px]">${periodLabel(c.j, i)}${locked ? ' • مقفل' : ''}</div></div></div>
      ${locked ? '<i class="fa-solid fa-lock"></i>' : `<div class="flex gap-1"><button class="btn b-sec" data-act="od-up" data-i="${i}" ${i <= lock ? 'disabled' : ''}>▲</button><button class="btn b-sec" data-act="od-down" data-i="${i}" ${i >= d.length - 1 ? 'disabled' : ''}>▼</button></div>`}</div>`;
  }).join('');
  showModal('تعديل ترتيب القبض', `<div class="space-y-3">
    <p class="text-[11px] text-slate-500">حرّك الأعضاء بالأسهم. الدورات المنتهية أو التي بدأ فيها السداد مقفلة لحماية سجل المدفوعات.</p>
    <div class="space-y-2">${rows}</div>
    <div class="flex gap-2"><button class="btn b-sec" data-act="od-shuffle"><i class="fa-solid fa-shuffle"></i> عشوائي للمتاح</button><button class="btn b-pri flex-1" data-act="od-save">حفظ الترتيب</button></div></div>`);
}
function orderMove(i, dlt) {
  const c = ctx(), d = state.orderDraft, k = i + dlt;
  if (i < lockedCount(c) || k < lockedCount(c) || k >= d.length) return;
  [d[i], d[k]] = [d[k], d[i]]; showOrderModal();
}
function orderShuffle() {
  const c = ctx(), d = state.orderDraft, lock = lockedCount(c);
  const free = d.slice(lock);
  for (let i = free.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [free[i], free[k]] = [free[k], free[i]]; }
  state.orderDraft = d.slice(0, lock).concat(free); showOrderModal();
}
async function orderSave() {
  const c = ctx();
  if (state.orderDraft.slice(0, lockedCount(c)).join() !== c.turns.slice(0, lockedCount(c)).join()) return toast('لا يمكن تغيير الدورات المقفلة', 'error');
  try { await db.collection('jamiyat').doc(c.j.id).update({ turns: state.orderDraft }); closeModal(); toast('تم حفظ ترتيب القبض'); logEvent(c.j.id, 'order', `${dispName(state.profile)} عدّل ترتيب القبض`); }
  catch (e) { toast(e.message, 'error'); }
}

let statBuf = {}, statTimer = null;
const mergeSpec = (t, sp) => { Object.entries(sp).forEach(([k, v]) => { if (v && typeof v === 'object') mergeSpec(t[k] = t[k] || {}, v); else t[k] = (t[k] || 0) + v; }); return t; };

function flushStats() {

  const conv = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, v && typeof v === 'object' ? conv(v) : FV.increment(v)]));
  const d = dayKey();
  return db.collection('stats').doc(d).set({ day: d, ...conv(spec) }, { merge: true }).catch(() => {});
}

/* التحكم */
const ADMIN_RULES = `// أضِف هذه القواعد داخل: match /databases/{database}/documents { ... }
function signedIn() { return request.auth != null; }
function isOwner() { return signedIn() && request.auth.token.email == "${OWNER_EMAIL}" && request.auth.token.email_verified == true; }
function isAdm() { return isOwner() || (signedIn() && exists(/databases/$(database)/documents/admins/$(request.auth.uid))); }

match /activity/{uid} {
  allow read: if isAdm() || (signedIn() && request.auth.uid == uid);
  allow write: if signedIn() && request.auth.uid == uid;
}
match /events/{id} {
  allow read: if isAdm();
  allow create: if signedIn() && request.resource.data.uid == request.auth.uid;
}
match /stats/{day} {
  allow read: if isAdm();
  allow create: if request.resource.data.keys().hasOnly(['day','visits','pv','logins','dau','regs','pwa','dev','os','br','src','hours','views']);
  allow update: if request.resource.data.diff(resource.data).affectedKeys().hasOnly(['day','visits','pv','logins','dau','regs','pwa','dev','os','br','src','hours','views']);
}
match /blocked/{uid} {
  allow read: if isAdm() || (signedIn() && request.auth.uid == uid);
  allow write: if isAdm();
}
match /admin_notes/{id} { allow read, write: if isAdm(); }
match /settings/{id} { allow read: if true; allow write: if isAdm(); }
match /admins/{uid} {
  allow read: if signedIn() && (request.auth.uid == uid || isAdm());
  allow write: if isOwner();
}

// تُعرض فقط والتطبيق في الخلفية (داخل التطبيق تكفي الرسائل)، ولا تتكرر لنفس الحدث
const seenKey = () => 'jm_nseen_' + (state.user ? state.user.uid : '');
function pushLocal(title, body, tag, jid) {
  if (!notifOn()) return;
  let seen = []; try { seen = JSON.parse(lsGet(seenKey()) || '[]'); } catch (e) {}

  else return; // تنبيهات المواعيد تنتظر حتى يصبح التطبيق في الخلفية
  seen.push(tag); lsSet(seenKey(), JSON.stringify(seen.slice(-300)));
}

/* ============ دفع الإشعارات للجوال المغلق (FCM) ============
   الصق هنا مفتاح الويب (Web Push certificate / VAPID) من: Firebase ← إعدادات المشروع ← Cloud Messaging */
const VAPID_KEY = 'BG6l6SR11DQISd1WtcgOLJSS6rVbTN5uudknpGyt8yZBhYqCnjQpaJ9QKC6QQuILPbvtUWVpWnSroZFrSCJsYPM';
async function registerPush(force) {
  try {
    if (!VAPID_KEY || !state.user || !notifOn() || !firebase.messaging || !(await firebase.messaging.isSupported())) return { ok: false, err: 'unsupported' };
    const reg = await navigator.serviceWorker.ready;
    const tok = await firebase.messaging().getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (!tok) return { ok: false, err: 'no-token' };
    const key = state.user.uid + ':' + tok;
    if (force || state._pushReg !== key) { await db.collection('users').doc(state.user.uid).set({ fcmTokens: FV.arrayUnion(tok) }, { merge: true }); state._pushReg = key; }
    return { ok: true };
  } catch (e) { console.warn('push', e.code || e.message); return { ok: false, err: e.code || e.message }; }
}
// عند تسجيل الخروج: نفكّ ارتباط هذا الجهاز بالحساب ونُلغي رمزه، فيبدأ الحساب التالي برمز جديد نظيف
async function unregisterPush() {
  try {
    if (!state.user || !VAPID_KEY || !notifSupported() || Notification.permission !== 'granted' || !firebase.messaging || !(await firebase.messaging.isSupported())) return;
    const m = firebase.messaging(), reg = await navigator.serviceWorker.ready;
    const tok = await m.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (tok) await db.collection('users').doc(state.user.uid).update({ fcmTokens: FV.arrayRemove(tok) });
    await m.deleteToken(); state._pushReg = '';
  } catch (e) { console.warn('unpush', e.code || e.message); }
}
/* ============ مركز الإشعارات: مستند لكل إشعار يصل للمستلم (يُسلَّم فور فتح التطبيق أو وهو في الخلفية) ============ */
async function sendNotifs(uids, title, body, jid, kind, tag) {
  const me = state.user && state.user.uid;
  const list = [...new Set(uids || [])].filter(u => u && u !== me);
  if (!list.length) return 0;
  try {
    for (let i = 0; i < list.length; i += 400) {
      const b = db.batch();
      list.slice(i, i + 400).forEach(to => b.set(db.collection('notifs').doc(), { toUid: to, fromUid: me, title: String(title).slice(0, 100), body: String(body).slice(0, 500), jid: jid || '', kind: kind || 'info', tag: tag || '', pushed: false, read: false, createdAt: FV.serverTimestamp() }));
      await b.commit();
    }
    return list.length;
  } catch (e) { console.warn('notif', e.code || e.message); return 0; }
}
const nSecs = n => (n.createdAt && n.createdAt.seconds) || 0;
const unreadCount = () => (state.inbox || []).filter(n => n.read !== true).length;
function listenNotifs() {
  const uid = state.user.uid; state.nq = []; state.inbox = []; state._pruned = new Set();
  state.unsubs.push(db.collection('notifs').where('toUid', '==', uid).onSnapshot(s => {
    state.inbox = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => nSecs(b) - nSecs(a));
    s.docChanges().forEach(c => {
      if (c.type !== 'added' || c.doc.metadata.hasPendingWrites) return;
      const n = { id: c.doc.id, ...c.doc.data() };
      // يُعرض محلياً إن لم يدفعه الخادم لجهاز المستخدم (أو لم يكن للمستخدم جهاز مسجّل)
      if (n.read !== true && n.delivered !== true && (n.pushed !== true || n.noPush === true)) state.nq.push(n);
    });
    state.inbox.slice(30).forEach(n => { if (!state._pruned.has(n.id)) { state._pruned.add(n.id); db.collection('notifs').doc(n.id).delete().catch(() => {}); } }); // نحتفظ بآخر 30
    flushNotifs(); renderNav();
  }, () => {}));
}
function flushNotifs() {
  const q = state.nq || []; if (!q.length) return;
  const hidden = document.visibilityState === 'hidden';
  if (hidden && !notifOn()) return; // تبقى بانتظار فتح التطبيق
  state.nq = [];
  let seen = []; try { seen = JSON.parse(lsGet(seenKey()) || '[]'); } catch (e) {}
  const tg = n => n.tag || ('n_' + n.id);
  const fresh = q.filter(n => !seen.includes(tg(n)));
  fresh.sort((a, b) => nSecs(a) - nSecs(b));
  const show = (title, body, tag, jid) => hidden ? showSysNotif(title, body, tag, jid) : toast(title + ' — ' + body, 'info');
  fresh.slice(0, 3).forEach(n => show(n.title, n.body, tg(n), n.jid));
  if (fresh.length > 3) show('الجمعية الذكية', 'لديك ' + nf(fresh.length - 3) + ' إشعارات أخرى جديدة', 'more_' + Date.now(), '');
  fresh.forEach(n => seen.push(tg(n))); lsSet(seenKey(), JSON.stringify(seen.slice(-300)));
  q.forEach(n => db.collection('notifs').doc(n.id).update({ pushed: true, delivered: true }).catch(() => {}));
}
async function markInboxRead() {
  const un = (state.inbox || []).filter(n => n.read !== true).slice(0, 30); if (!un.length) return;
  un.forEach(n => { n.read = true; }); renderNav();
  try { const b = db.batch(); un.forEach(n => b.update(db.collection('notifs').doc(n.id), { read: true })); await b.commit(); } catch (e) {}
}

  const stB = { confirmed: ['مؤكدة', 'bg-emerald-100 text-emerald-700'], pending: ['بانتظار التأكيد', 'bg-sky-100 text-sky-700'] };

      <div><b>${fmtNum(p.amount)} ريال</b> <span class="px-1.5 py-0.5 rounded ${b[1]} font-bold">${b[0]}</span>
      <div class="text-slate-500">دورة ${esc(periodLabel(c.j, p.month))}${p.ref ? ' • مرجع: ' + esc(p.ref) : ''}</div></div>

/* ============ رغبة الاستلام + دردشة الجمعية (يفتحها المشرف ويغلقها) ============ */
const isStaffJ = j => !!j && !!state.user && (j.creatorUid === state.user.uid || (!!j.deputyUid && j.deputyUid === state.user.uid));
const openPill = o => `<span class="px-2 py-0.5 rounded-lg text-[10px] font-bold ${o ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}"><i class="fa-solid ${o ? 'fa-lock-open' : 'fa-lock'}"></i> ${o ? 'مفتوحة' : 'مغلقة'}</span>`;
const jref = () => db.collection('jamiyat').doc(state.j.id);

// المشرف ونائبه يريان كل الرغبات، والعضو يرى رغبته فقط
function syncWishes() {
  const j = state.j; if (!j || !state.user || j.type === 'family') return;
  const mode = isStaffJ(j) ? 'all' : 'mine';
  if (state.wishMode === mode) return;
  if (state.wishUnsub) { state.wishUnsub(); state.wishUnsub = null; }
  state.wishMode = mode; state.wishes = {};
  const col = jref().collection('wishes'), uid = state.user.uid, redraw = () => { if (state.view === 'jamiya') render(); };
  const onErr = e => { if (e.code !== 'permission-denied') toast('خطأ في تحميل الرغبات: ' + e.message, 'error'); };
  state.wishUnsub = mode === 'all'
    ? col.onSnapshot(s => { state.wishes = {}; s.docs.forEach(d => state.wishes[d.id] = d.data()); redraw(); }, onErr)
    : col.doc(uid).onSnapshot(s => { state.wishes = s.exists ? { [uid]: s.data() } : {}; redraw(); }, onErr);
}
const wishLine = (j, w) => `${w.pos ? 'الدور ' + w.pos + ' — ' + periodLabel(j, w.pos - 1) : 'بلا دور محدد'}${w.text ? ' • ' + esc(w.text) : ''}`;
function wishCard(c) {
  const j = c.j, open = !!j.wishOpen, uid = state.user.uid; if (!j.memberUids.includes(uid)) return '';
  const mine = state.wishes[uid];
  const myBox = mine ? `<div class="p-3 bg-emerald-50 border border-emerald-100 rounded-xl text-xs"><p class="text-[10px] text-emerald-700 font-bold mb-0.5">رغبتك</p>${wishLine(j, mine)}</div>`
    : `<p class="text-xs text-slate-400">${open ? 'لم تكتب رغبتك بعد.' : 'لم تكتب رغبة في هذه الجمعية.'}</p>`;
  let all = '';
  if (c.canManage) {
    const list = c.uniq.filter(u => state.wishes[u]), missing = c.uniq.filter(u => !state.wishes[u]);
    all = `<div class="pt-3 mt-3 border-t border-slate-100 space-y-1.5"><p class="text-[11px] font-bold text-slate-600">رغبات الأعضاء (${list.length}/${c.uniq.length})</p>
      ${list.map(u => `<div class="p-2 bg-slate-50 rounded-xl text-[11px]"><b>${esc(dispName(state.members[u]))}</b> <span class="text-slate-400">(ترتيبه الحالي ${c.turns.map((x, k) => x === u ? k + 1 : 0).filter(Boolean).join('، ')})</span><div class="text-slate-600">${wishLine(j, state.wishes[u])}</div></div>`).join('') || '<p class="text-[11px] text-slate-400">لا توجد رغبات بعد.</p>'}
      ${missing.length && list.length ? `<p class="text-[10px] text-slate-400">لم يكتب بعد: ${missing.map(u => esc(dispName(state.members[u]))).join('، ')}</p>` : ''}
      ${c.isCreator && c.turns.length > 1 ? '<button class="btn b-sec w-full" data-act="order-modal"><i class="fa-solid fa-arrow-down-1-9"></i> تعديل ترتيب القبض</button>' : ''}</div>`;
  }
  return `<div class="card p-5"><div class="flex justify-between items-center mb-3"><h4 class="font-bold text-sm"><i class="fa-solid fa-hand-holding-heart text-rose-500"></i> رغبة الاستلام</h4>${openPill(open)}</div>
    <div class="space-y-2.5">${myBox}${open ? `<button class="btn b-pri w-full" data-act="wish-modal"><i class="fa-solid fa-pen"></i> ${mine ? 'تعديل رغبتي' : 'اكتب رغبتي في الاستلام'}</button>` : '<p class="text-[11px] text-slate-500 leading-relaxed">يفتح المشرف الباب عندما يريد جمع رغبات الأعضاء في ترتيب الاستلام.</p>'}
    ${c.isCreator ? `<button class="btn ${open ? 'b-red' : 'b-sec'} w-full" data-act="wish-toggle"><i class="fa-solid ${open ? 'fa-lock' : 'fa-lock-open'}"></i> ${open ? 'إغلاق باب الرغبات' : 'فتح باب الرغبات للأعضاء'}</button>` : ''}</div>${all}</div>`;
}
function openWishModal() {
  const c = ctx(); if (!c) return;
  if (!c.j.wishOpen) return toast('باب الرغبات مغلق الآن', 'error');
  const w = state.wishes[state.user.uid] || {}, opts = ['<option value="0">لا أفضّل دوراً معيناً</option>'];
  for (let i = lockedCount(c); i < c.j.count; i++) opts.push(`<option value="${i + 1}" ${w.pos === i + 1 ? 'selected' : ''}>الدور ${i + 1} — ${periodLabel(c.j, i)}</option>`);
  showModal('رغبتي في الاستلام', `<form id="f-wish" class="space-y-3">
    <div><label class="text-xs font-semibold block mb-1">الدور الذي تفضّله</label><select name="pos" class="inp">${opts.join('')}</select></div>
    <div><label class="text-xs font-semibold block mb-1">ملاحظة للمشرف (اختياري)</label><textarea name="text" rows="3" maxlength="200" class="inp" placeholder="مثال: أحتاج المبلغ قبل بداية الدراسة">${esc(w.text || '')}</textarea></div>
    <p class="text-[11px] text-slate-500 leading-relaxed">رغبتك تظهر للمشرف ونائبه فقط، والقرار النهائي في ترتيب القبض للمشرف.</p>
    <button class="btn b-pri w-full py-3" type="submit">حفظ رغبتي</button>${w.uid ? '<button type="button" class="btn b-red w-full" data-act="wish-del">حذف رغبتي</button>' : ''}</form>`);
}
async function submitWish(f) {
  const j = state.j; if (!j) return;
  if (!j.wishOpen) return toast('باب الرغبات مغلق الآن', 'error');
  const text = f.text.value.trim().slice(0, 200), pos = parseInt(f.pos.value, 10) || 0, uid = state.user.uid;
  if (!text && !pos) return toast('اختر الدور الذي تفضّله أو اكتب ملاحظتك', 'error');
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  const first = !state.wishes[uid];
  try {
    await jref().collection('wishes').doc(uid).set({ uid, text, pos, updatedAt: FV.serverTimestamp() });

// نسبة الالتزام: الدورات التي سدّد فيها العضو كامل المطلوب في موعدها ÷ الدورات التي حان موعدها
function commitRate(c, u) {
  if (!c.started) return null;
  const j = c.j, sh = sharesOf(c.turns, u), now = Date.now(); let on = 0, tot = 0;
  for (let k = 0; k <= c.cur && k < j.count; k++) {
    const req = r2(j.amount * (sh - (c.turns[k] === u ? 1 : 0))); if (req <= 0) continue;
    const dueEnd = dayIn(j, k, j.lastDay).getTime() + 864e5;
    const paid = r2(state.payments.filter(p => p.uid === u && p.month === k && tsd(p.createdAt) && tsd(p.createdAt).getTime() <= dueEnd).reduce((t, p) => t + (Number(p.amount) || 0), 0));
    const done = paid >= req - 0.005;
    if (!done && dueEnd > now) continue; // لم يحن موعدها بعد
    tot++; if (done) on++;
  }
  return tot ? { pct: Math.round(on / tot * 100), on, tot } : null;
}
function rateBadge(c, u) {
  const r = commitRate(c, u); if (!r) return '<span class="text-[10px] px-1.5 py-0.5 rounded-md bg-slate-100 text-slate-500">جديد</span>';
  const cl = r.pct >= 90 ? 'bg-emerald-100 text-emerald-700' : r.pct >= 70 ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700';
  return `<span class="text-[10px] px-1.5 py-0.5 rounded-md ${cl}" title="${r.on} من ${r.tot} دورات في الموعد">التزام ${r.pct}%</span>`;
}

/* --- قفل التطبيق برمز --- */
const lockKey = () => 'jm_lock_' + (state.user ? state.user.uid : '');
const lockCfg = () => { try { return JSON.parse(lsGet(lockKey()) || 'null'); } catch (e) { return null; } };
async function pinHash(pin, salt) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  const b = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 100000, hash: 'SHA-256' }, k, 256);
  return Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, '0')).join('');
}
let lockBuf = '', lockTries = 0;
function unlock() { const e = document.getElementById('lock-screen'); if (e) e.remove(); lockBuf = ''; lockTries = 0; }
function paintDots() {
  const cfg = lockCfg(), box = $('lock-dots'); if (!cfg || !box) return;
  box.innerHTML = Array.from({ length: cfg.len }, (_, i) => `<span style="width:14px;height:14px;border-radius:50%;border:2px solid #94a3b8;background:${i < lockBuf.length ? '#fff' : 'transparent'}"></span>`).join('');
}
function showLock() {
  if (document.getElementById('lock-screen') || !lockCfg()) return;
  lockBuf = '';
  const d = document.createElement('div'); d.id = 'lock-screen';
  d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;direction:rtl';
  d.innerHTML = `<img src="icon-192.png" style="width:64px;height:64px;border-radius:16px" alt=""><p style="font-weight:900;font-size:18px">أدخل رمز القفل</p><div id="lock-dots" style="display:flex;gap:12px;height:16px"></div><p id="lock-msg" style="font-size:12px;color:#fda4af;height:16px"></p>
    <div style="display:grid;grid-template-columns:repeat(3,72px);gap:12px;direction:ltr">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<span></span>' : `<button type="button" data-k="${k}" style="height:56px;border-radius:16px;background:#1e293b;color:#fff;font-size:22px;font-weight:700">${k}</button>`).join('')}</div>
    <button type="button" data-forgot style="font-size:12px;color:#94a3b8;text-decoration:underline">نسيت الرمز؟ تسجيل الخروج</button>`;
  document.body.appendChild(d); paintDots(); d.addEventListener('click', onLockClick);
}
function onLockClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-forgot')) return lockForgot();
  const k = b.dataset.k, cfg = lockCfg(); if (k === undefined) return; if (!cfg) return unlock();
  if (k === '⌫') lockBuf = lockBuf.slice(0, -1); else if (lockBuf.length < cfg.len) lockBuf += k;
  paintDots(); if (lockBuf.length === cfg.len) verifyLock(cfg);
}

  'swap-modal': el => openSwapModal(+el.dataset.i), 'swap-yes': el => approveSwap(el.dataset.id), 'swap-no': el => rejectSwap(el.dataset.id, false), 'swap-cancel': el => rejectSwap(el.dataset.id, true)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (fn) fn(el);
});
document.addEventListener('change', e => {
  if (e.target.matches && e.target.matches('select[data-freq]') && e.target.form) {
    const dl = dayLabels(e.target.value), fm = e.target.form;
    const l1 = fm.querySelector('[data-lbl-last]'), l2 = fm.querySelector('[data-lbl-pay]');
    if (l1) l1.textContent = dl.last; if (l2) l2.textContent = dl.pay;
    ['lastDay', 'payDay'].forEach(n => { if (fm[n]) { fm[n].max = dl.max; if (+fm[n].value > dl.max) fm[n].value = dl.max; } });
  }
  if (e.target.name === 'bank' && e.target.form) {
    const box = e.target.form.querySelector('[data-other]');
    if (box) box.classList.toggle('hide', e.target.value !== OTHER_BANK);
  }
});
document.addEventListener('input', e => {
  const fm = e.target.form; if (!fm) return;
  if (fm.querySelector('[data-identity]')) updPreview(fm);
  if (e.target.name === 'icon') fm.querySelectorAll('.emo').forEach(b => b.classList.toggle('on', b.dataset.v === e.target.value.trim()));
});
const forms = { 'f-register': doRegister, 'f-login': doLogin, 'f-reset': doReset, 'f-complete': doCompleteProfile, 'f-create': handleCreate,
  'f-invite': handleInvite, 'f-pay': submitPayment, 'f-mod': submitMod, 'f-notif': submitNotif, 'f-deputy': f => setDeputy(f.uid.value), 'f-edit': submitEdit, 'f-profile': saveProfile, 'f-delete': submitDelete, 'f-wish': submitWish, 'f-chat': sendChat, 'f-create-family': handleCreateFamily, 'f-fampay': submitFamilyPay, 'f-famedit': submitFamilyEdit, 'f-share': submitShare, 'f-swap': submitSwap, 'f-lock': submitLock, 'f-lockoff': submitLockOff };
Object.assign(forms, ADMIN_FORMS);
document.addEventListener('submit', e => { const fn = forms[e.target.id]; if (fn) { e.preventDefault(); fn(e.target); } });

watchSettings(); trackVisit();
render();
</script>
<div id="print-root"></div>
</body>
</html>
