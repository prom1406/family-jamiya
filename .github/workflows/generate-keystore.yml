name: Generate upload keystore (مرة واحدة ثم احذفه)

# يُشغَّل يدوياً مرة واحدة فقط: Actions ← Generate upload keystore ← Run workflow
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: إنشاء مفتاح التوقيع وكلمة المرور
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore upload.jks -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Siwaa, OU=Mobile, O=Siwaa, L=Jeddah, S=Makkah, C=SA"
          base64 -w0 upload.jks > upload.jks.b64
          {
            echo "ANDROID_KEY_ALIAS=upload"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_PASSWORD=$PASS"
          } > credentials.txt
          keytool -list -keystore upload.jks -storepass "$PASS" | head -5

      - name: حفظ الملفات كأثر مؤقت (تُحذف بعد نسخها)
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: |
            upload.jks
            upload.jks.b64
            credentials.txt
          retention-days: 1
