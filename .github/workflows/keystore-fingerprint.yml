name: Keystore fingerprint (بصمات عامة، ليست أسراراً)

on:
  workflow_dispatch:

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: طباعة بصمات مفتاح الرفع
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > upload.jks
          keytool -list -v -keystore upload.jks -alias "$KS_ALIAS" -storepass "$KS_PASS" \
            | grep -E "SHA1|SHA256"
          rm -f upload.jks
