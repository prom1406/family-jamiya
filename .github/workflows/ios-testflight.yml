name: iOS → TestFlight

# يُشغَّل يدوياً فقط: Actions ثم iOS → TestFlight ثم Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: "رقم الإصدار الظاهر للمستخدم (MARKETING_VERSION)"
        default: "1.0"
        required: true
      universal_links:
        description: "تفعيل الروابط الذكية (فعّل Associated Domains في App ID أولاً)"
        type: boolean
        default: false

env:
  BUNDLE_ID: com.prom1406.sewaa

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: اختيار أحدث Xcode 26 (آبل تشترط iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "لا يوجد Xcode 26 على هذا الجهاز:"; ls -d /Applications/Xcode*; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: تثبيت الحزم
        run: npm install --no-audit --no-fund

      - name: تجهيز ملفات الويب (مع تضمين المكتبات محلياً)
        run: |
          if npm run build:native; then
            echo "✓ المكتبات مضمّنة محلياً"
          else
            echo "::warning::تعذر تضمين المكتبات محلياً؛ سيُبنى التطبيق بالمصادر الخارجية (CDN) كما كان"
            npm run build:www
          fi

      - name: ضبط الدخول بجوجل داخل التطبيق (من GoogleService-Info.plist)
        run: |
          python3 - <<'PY'
          import os, plistlib, re
          f = "ios-config/GoogleService-Info.plist"
          if not os.path.exists(f):
              print("::warning::لا يوجد ios-config/GoogleService-Info.plist: سيُخفى زر جوجل داخل التطبيق.")
          else:
              cid = plistlib.load(open(f, "rb")).get("CLIENT_ID", "")
              if not cid:
                  print("::warning::الملف لا يحتوي CLIENT_ID (فعّل الدخول بجوجل في Firebase ثم حمّل الملف من جديد): سيُخفى زر جوجل.")
              else:
                  p = "www/index.html"; h = open(p, encoding="utf8").read()
                  new = h.replace("const GOOGLE_IOS_CLIENT_ID = '';", "const GOOGLE_IOS_CLIENT_ID = '%s';" % cid, 1)
                  assert new != h, "لم يُعثر على GOOGLE_IOS_CLIENT_ID في index.html"
                  open(p, "w", encoding="utf8").write(new); print("CLIENT_ID جاهز")
          PY

      - name: تجهيز أيقونة التطبيق (1024، بدون شفافية)
        run: |
          pip3 install --quiet pillow --break-system-packages || pip3 install --quiet pillow
          mkdir -p assets
          python3 - <<'PY'
          from PIL import Image
          im = Image.open("icon-512.png").convert("RGBA")
          bg = Image.new("RGBA", im.size, (255, 255, 255, 255))
          bg.alpha_composite(im)
          bg.convert("RGB").resize((1024, 1024), Image.LANCZOS).save("assets/icon-only.png")
          # شاشة البداية: فاتحة وداكنة (تتبع مظهر الجهاز)
          def splash(color, tile, name):
              S = 2732
              canvas = Image.new("RGB", (S, S), color)
              logo = im.resize((620, 620), Image.LANCZOS)
              if tile:
                  from PIL import ImageDraw
                  t = Image.new("RGBA", (780, 780), (0, 0, 0, 0))
                  ImageDraw.Draw(t).rounded_rectangle((0, 0, 779, 779), radius=170, fill=(255, 255, 255, 255))
                  canvas.paste(t, ((S - 780) // 2, (S - 780) // 2), t)
              canvas.paste(logo, ((S - 620) // 2, (S - 620) // 2), logo)
              canvas.save("assets/" + name)
          splash((245, 247, 245), False, "splash.png")
          splash((11, 21, 18), True, "splash-dark.png")
          PY

      - name: إنشاء مشروع iOS
        run: |
          npx cap add ios
          # توثيق الجوال الأصلي مع حماية SMS يحتاج مكتبة reCAPTCHA Enterprise (وتتطلب iOS 15 أو أحدث)
          python3 - <<'PY'
          import re
          p = "ios/App/Podfile"
          s = open(p, encoding="utf8").read()
          s, n = re.subn(r"platform :ios, '[0-9.]+'", "platform :ios, '15.0'", s, count=1)
          assert n == 1, "لم يُعثر على platform :ios في Podfile"
          if "RecaptchaEnterprise" not in s:
              assert "# Add your Pods here" in s, "لم يُعثر على موضع إضافة الحزم في Podfile"
              s = s.replace("# Add your Pods here", "# Add your Pods here\n  pod 'RecaptchaEnterprise', '>= 18.6'", 1)
          open(p, "w", encoding="utf8").write(s)
          PY
          cat ios/App/Podfile
          npx cap sync ios

      - name: توليد الأيقونات
        run: npx capacitor-assets generate --ios

      - name: ملف Firebase للإشعارات (GoogleService-Info.plist)
        env:
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
        run: |
          if [ -f ios-config/GoogleService-Info.plist ]; then
            cp ios-config/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
            echo "استُخدم ios-config/GoogleService-Info.plist"
            exit 0
          fi
          if [ -z "$FIREBASE_IOS_APP_ID" ]; then
            echo "::error::ضع ملف GoogleService-Info.plist في ios-config/ أو أضف السر FIREBASE_IOS_APP_ID. بدونه ينهار التطبيق عند الفتح."
            exit 1
          fi
          python3 - <<'PY'
          import os, re, plistlib
          h = open("index.html", encoding="utf8").read()
          blk = h[h.index("const firebaseConfig"):]
          blk = blk[:blk.index("};")]
          g = lambda k: re.search(k + r'\s*:\s*"([^"]+)"', blk).group(1)
          d = {
            "API_KEY": g("apiKey"), "GCM_SENDER_ID": g("messagingSenderId"), "PLIST_VERSION": "1",
            "BUNDLE_ID": os.environ["BUNDLE_ID"], "PROJECT_ID": g("projectId"), "STORAGE_BUCKET": g("storageBucket"),
            "IS_ADS_ENABLED": False, "IS_ANALYTICS_ENABLED": False, "IS_APPINVITE_ENABLED": True,
            "IS_GCM_ENABLED": True, "IS_SIGNIN_ENABLED": True, "GOOGLE_APP_ID": os.environ["FIREBASE_IOS_APP_ID"].strip(),
          }
          with open("ios/App/App/GoogleService-Info.plist", "wb") as f:
              plistlib.dump(d, f)
          print("GoogleService-Info.plist جاهز:", d["PROJECT_ID"], d["GOOGLE_APP_ID"])
          PY

      - name: تمرير أحداث الإشعارات في AppDelegate
        run: |
          python3 - <<'PY'
          p = "ios/App/App/AppDelegate.swift"
          s = open(p, encoding="utf8").read()
          if "capacitorDidRegisterForRemoteNotifications" not in s:
              add = '''
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }

              func application(_ application: UIApplication, didReceiveRemoteNotification userInfo: [AnyHashable: Any], fetchCompletionHandler completionHandler: @escaping (UIBackgroundFetchResult) -> Void) {
                  NotificationCenter.default.post(name: Notification.Name.init("didReceiveRemoteNotification"), object: completionHandler, userInfo: userInfo)
              }
          '''
              i = s.rstrip().rfind("}")
              s = s[:i] + add + "\n}\n"
              open(p, "w", encoding="utf8").write(s)
          print("AppDelegate OK")
          PY
          grep -c "capacitorDidRegisterForRemoteNotifications" ios/App/App/AppDelegate.swift

      - name: تمرير روابط reCAPTCHA لتوثيق الجوال الأصلي في AppDelegate
        run: |
          python3 - <<'PY'
          p = "ios/App/App/AppDelegate.swift"
          s = open(p, encoding="utf8").read()
          if "Auth.auth().canHandle" not in s:
              for imp in ("import FirebaseAuth", "import FirebaseCore"):
                  if imp not in s:
                      s = s.replace("import Capacitor", "import Capacitor\n" + imp, 1)
              ret = "return ApplicationDelegateProxy.shared.application(app, open: url, options: options)"
              assert ret in s, "لم يُعثر على application(_:open:options:) في AppDelegate"
              s = s.replace(ret, "if FirebaseApp.app() != nil, Auth.auth().canHandle(url) { return true }\n        " + ret, 1)
              open(p, "w", encoding="utf8").write(s)
          print("AppDelegate auth url OK")
          PY
          grep -n "canHandle\|import Firebase" ios/App/App/AppDelegate.swift

      - name: إعدادات المشروع (التوقيع وSign in with Apple)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          UNIVERSAL_LINKS: ${{ inputs.universal_links }}
        run: |
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.applesignin</key>
            <array><string>Default</string></array>
            <key>aps-environment</key>
            <string>development</string>
          </dict>
          </plist>
          EOF
          if [ "$UNIVERSAL_LINKS" = "true" ]; then
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.associated-domains array" -c "Add :com.apple.developer.associated-domains:0 string applinks:aljameyah.com" ios/App/App/App.entitlements
          fi
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist
          RC=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/App/App/GoogleService-Info.plist 2>/dev/null || true)
          if [ -n "$RC" ]; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" -c "Add :CFBundleURLTypes:0 dict" -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $RC" ios/App/App/Info.plist
          fi
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" -c "Add :UIBackgroundModes:0 string remote-notification" ios/App/App/Info.plist
          # أذونات الكاميرا والصور: بدونها يُغلق iOS التطبيق فوراً عند اختيار «التقاط صورة» لإيصال السداد
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string يحتاج سِواء إلى الكاميرا لالتقاط صورة إيصال السداد" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string يحتاج سِواء إلى الصور لاختيار صورة إيصال السداد" ios/App/App/Info.plist
          ruby scripts/patch-ios.rb

      - name: مفتاح App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

      - name: فحص صلاحيات الإشعارات في البناء (تشخيص)
        run: |
          APP="build/App.xcarchive/Products/Applications/App.app"
          echo "== Entitlements الموقّعة داخل التطبيق =="
          codesign -d --entitlements :- "$APP" 2>&1 | grep -A1 -E "aps-environment|applesignin|application-identifier" || echo "لا يوجد aps-environment!"
          echo "== ملف التوفير (Provisioning Profile) =="
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null | grep -A1 -E "aps-environment|<key>Name</key>" || echo "لا يوجد ملف توفير"
          echo "== ملف Firebase داخل التطبيق =="
          ls -la "$APP/GoogleService-Info.plist" || echo "GoogleService-Info.plist غير موجود في التطبيق!"

      - name: Export ورفع إلى App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: حذف المفتاح
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
