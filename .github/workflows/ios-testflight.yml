name: iOS → TestFlight

# يُشغَّل يدوياً فقط: Actions ثم iOS → TestFlight ثم Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: "رقم الإصدار الظاهر للمستخدم (MARKETING_VERSION)"
        default: "1.0"
        required: true

env:
  BUNDLE_ID: com.prom1406.sewaa

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: اختيار أحدث Xcode 26 (آبل تشترط iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "لا يوجد Xcode 26 على هذا الجهاز:"; ls -d /Applications/Xcode*; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: تثبيت الحزم
        run: npm install --no-audit --no-fund

      - name: تجهيز ملفات الويب
        run: npm run build:www

      - name: تجهيز أيقونة التطبيق (1024، بدون شفافية)
        run: |
          pip3 install --quiet pillow --break-system-packages || pip3 install --quiet pillow
          mkdir -p assets
          python3 - <<'PY'
          from PIL import Image
          im = Image.open("icon-512.png").convert("RGBA")
          bg = Image.new("RGBA", im.size, (255, 255, 255, 255))
          bg.alpha_composite(im)
          bg.convert("RGB").resize((1024, 1024), Image.LANCZOS).save("assets/icon-only.png")
          PY

      - name: إنشاء مشروع iOS
        run: |
          npx cap add ios
          npx cap sync ios

      - name: توليد الأيقونات
        run: npx capacitor-assets generate --ios

      - name: ملف Firebase للإشعارات (GoogleService-Info.plist)
        env:
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
        run: |
          if [ -z "$FIREBASE_IOS_APP_ID" ]; then
            echo "::error::أضف السر FIREBASE_IOS_APP_ID (معرّف تطبيق iOS من Firebase ← إعدادات المشروع، شكله 1:508199870007:ios:xxxx). بدونه ينهار التطبيق عند الفتح."
            exit 1
          fi
          python3 - <<'PY'
          import os, re, plistlib
          h = open("index.html", encoding="utf8").read()
          blk = h[h.index("const firebaseConfig"):]
          blk = blk[:blk.index("};")]
          g = lambda k: re.search(k + r'\s*:\s*"([^"]+)"', blk).group(1)
          d = {
            "API_KEY": g("apiKey"), "GCM_SENDER_ID": g("messagingSenderId"), "PLIST_VERSION": "1",
            "BUNDLE_ID": os.environ["BUNDLE_ID"], "PROJECT_ID": g("projectId"), "STORAGE_BUCKET": g("storageBucket"),
            "IS_ADS_ENABLED": False, "IS_ANALYTICS_ENABLED": False, "IS_APPINVITE_ENABLED": True,
            "IS_GCM_ENABLED": True, "IS_SIGNIN_ENABLED": True, "GOOGLE_APP_ID": os.environ["FIREBASE_IOS_APP_ID"].strip(),
          }
          with open("ios/App/App/GoogleService-Info.plist", "wb") as f:
              plistlib.dump(d, f)
          print("GoogleService-Info.plist جاهز:", d["PROJECT_ID"], d["GOOGLE_APP_ID"])
          PY

      - name: تمرير أحداث الإشعارات في AppDelegate
        run: |
          python3 - <<'PY'
          p = "ios/App/App/AppDelegate.swift"
          s = open(p, encoding="utf8").read()
          if "capacitorDidRegisterForRemoteNotifications" not in s:
              add = '''
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }

              func application(_ application: UIApplication, didReceiveRemoteNotification userInfo: [AnyHashable: Any], fetchCompletionHandler completionHandler: @escaping (UIBackgroundFetchResult) -> Void) {
                  NotificationCenter.default.post(name: Notification.Name.init("didReceiveRemoteNotification"), object: completionHandler, userInfo: userInfo)
              }
          '''
              i = s.rstrip().rfind("}")
              s = s[:i] + add + "\n}\n"
              open(p, "w", encoding="utf8").write(s)
          print("AppDelegate OK")
          PY
          grep -c "capacitorDidRegisterForRemoteNotifications" ios/App/App/AppDelegate.swift

      - name: إعدادات المشروع (التوقيع وSign in with Apple)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.applesignin</key>
            <array><string>Default</string></array>
            <key>aps-environment</key>
            <string>development</string>
          </dict>
          </plist>
          EOF
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" -c "Add :UIBackgroundModes:0 string remote-notification" ios/App/App/Info.plist
          ruby scripts/patch-ios.rb

      - name: مفتاح App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

      - name: Export ورفع إلى App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: حذف المفتاح
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
