name: Android → Google Play

# يُشغَّل يدوياً: Actions ← Android → Google Play ← Run workflow
on:
  workflow_dispatch:
    inputs:
      track:
        description: "مسار النشر في Google Play"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
        required: true
      version_name:
        description: "رقم الإصدار الظاهر للمستخدم (versionName)"
        default: "1.0.1"
        required: true

env:
  PACKAGE: com.prom1406.sewaa

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: تثبيت الحزم
        run: npm install --no-audit --no-fund

      - name: تجهيز ملفات الويب
        run: npm run build:www

      - name: إنشاء مشروع Android (إن لم يكن موجوداً)
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: ملف Firebase للأندرويد (google-services.json)
        run: |
          if [ ! -f android-config/google-services.json ]; then
            echo "::error::ضع android-config/google-services.json في المستودع (من Firebase ← تطبيق Android)."
            exit 1
          fi
          cp android-config/google-services.json android/app/google-services.json

      - name: فك مفتاح التوقيع
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KS_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: تعديل الإصدار والتوقيع ومستوى SDK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
          TARGET_SDK: "35"
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/patch-android.py

      - name: بناء ملف AAB للنشر
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          ls -la app/build/outputs/bundle/release/

      - name: حفظ ملف AAB كأثر للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: sewaa-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: رفع إلى Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed
          releaseName: ${{ inputs.version_name }} (${{ github.run_number }})

      - name: حذف مفتاح التوقيع
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
